                            <tr><td>Before / after</td><td>${esc(info.before || plan && plan.before || '-')} / ${esc(info.after || plan && plan.after || '-')}</td></tr>
                            <tr><td>Analysis box [W, S, E, N]</td><td>${esc((info.bbox || (plan && plan.bbox) || []).join(', '))}</td></tr>` : ''}
                        <tr><td>Method</td><td>NISAR L2 GCOV, channel HH, smoothing 5 px, water below -17 dB, drop of at least 2 dB, clusters of 9+ px</td></tr>
                        ${Object.entries(m).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}
                        ${res && res.aviso ? `<tr><td>Server note</td><td style="font-family:inherit">${esc(res.aviso)}</td></tr>` : ''}
                        ${done ? Object.keys(files).map(f => `<tr><td>File</td><td><a href="${esc(apiFileUrl(ev.recordId, f))}" style="color:#7dd3fc">${esc(f)}</a></td></tr>`).join('') : ''}
                    </table>
                </details>`;
        }

        // ---------- picker (no event chosen yet) ----------
        const pickerStatus = new Map();   // key -> plan status

        function renderPicker() {
            radarWrap.innerHTML = `
                <div class="radar-top">
                    <div>
                        <h1>Radar comparison</h1>
                        <p>See how the ground changed after a disaster, using images from NISAR, the NASA and ISRO radar satellite. Pick an event below, or open one on the globe and press "Compare radar images".</p>
                    </div>
                    <button class="btn" data-r="back">${icon('back')} Back to the globe</button>
                </div>
                <section class="step picker">
                    <div class="picker-controls">
                        <div class="combo-input-wrap">${icon('search')}<input id="pick-q" type="text" placeholder="Search by place or name, for example Uruguay" autocomplete="off" style="flex:1;border:0;outline:0;background:transparent;padding:9px 0;color:var(--text-1)"></div>
                        <select class="select" id="pick-cat" aria-label="Type of disaster">
                            <option value="floods">Floods (best for this analysis)</option>
                            <option value="all">All types</option>
                            ${DOCK.filter(c => c !== 'floods').map(c => `<option value="${c}">${CATS[c].name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="muted" id="pick-note"></div>
                    <div class="picker-list" id="pick-list"></div>
                </section>`;
            const q = document.getElementById('pick-q'), sel = document.getElementById('pick-cat');
            q.addEventListener('input', fillPicker);
            sel.addEventListener('change', fillPicker);
            fillPicker();
        }

        function pickBadge(ev) {
            if (!ev.recordId) return '<span class="badge info">Checked when opened</span>';
            const st = pickerStatus.get(ev.key);
            if (!st) return '<span class="badge info"><span class="spinner" style="width:10px;height:10px"></span> Checking radar</span>';
            if (st === 'ok' || st === 'cobertura_baixa') return '<span class="badge good">Radar pair ready</span>';
            if (st === 'error') return '<span class="badge info">Radar check failed</span>';
            return '<span class="badge info">No radar pair</span>';
        }

        let pickToken = 0;
        function fillPicker() {
            const token = ++pickToken;
            const q = norm((document.getElementById('pick-q') || {}).value || '');
            const cat = (document.getElementById('pick-cat') || {}).value || 'floods';
            const pool = new Map();
            ((state.area && state.area.events) || []).forEach(ev => pool.set(ev.key, ev));
            apiEvents.forEach(ev => pool.set(ev.key, ev));
            const list = [...pool.values()]
                .filter(ev => (cat === 'all' || ev.cat === cat) && (!q || norm(`${ev.title} ${ev.country || ''}`).includes(q)))
                .sort((a, b) => String(b.time).localeCompare(String(a.time)))
                .slice(0, 30);
            document.getElementById('pick-note').textContent = list.length
                ? `${list.length === 30 ? 'Showing the 30 most recent' : plural(list.length, 'event')}${state.area ? `, including ${state.area.name || 'the area'} you selected on the globe` : ''}.`
                : 'No events match. Try another type or search term.';
            const draw = () => {
                if (token !== pickToken) return;
                document.getElementById('pick-list').innerHTML = list.map(ev => `
                    <button class="pick" data-r="pick" data-key="${esc(ev.key)}">
                        <span class="pick-title"><span class="dot" style="--c:${CATS[ev.cat].color}"></span>${esc(ev.title)}</span>
                        <span class="pick-meta"><span>${esc(ev.country || '')}${ev.country ? ' · ' : ''}${esc(fmtDate(ev.time, false))}</span>${pickBadge(ev)}</span>
                    </button>`).join('');
            };
            draw();
            // Check radar availability for the first rows, a few at a time (read-only calls)
            const todo = list.filter(ev => ev.recordId && !pickerStatus.has(ev.key)).slice(0, 9);
            let i = 0;
            const worker = async () => {
                while (i < todo.length && token === pickToken) {
                    const ev = todo[i++];
                    try { pickerStatus.set(ev.key, (await radarPlan(ev)).status); }
                    catch (err) { pickerStatus.set(ev.key, 'error'); }
                    draw();
                }
            };
            Promise.all([worker(), worker(), worker()]);
        }


        // ========================================================
        // 5. 3D NISAR SATELLITE (ADJUSTED MARGINS, ZERO CLIPPING)
        // ========================================================
        function createNisar3DElement() {
            const container = document.createElement('div');
            container.className = 'nisar-marker-container';

            const canvas = document.createElement('canvas');
            canvas.className = 'nisar-canvas-3d';
            canvas.width = 130;
            canvas.height = 130;
            container.appendChild(canvas);

            const tag = document.createElement('div');
            tag.className = 'nisar-orbit-tag';
            tag.textContent = 'NISAR';
            container.appendChild(tag);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 50);
            camera.position.set(2.7, 2.1, 3.9);
            camera.lookAt(0.12, 0.45, 0);

            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(130, 130);
            renderer.setPixelRatio(window.devicePixelRatio || 1);

            scene.add(new THREE.AmbientLight(0xffffff, 1.35));
            const sun = new THREE.DirectionalLight(0xffffff, 2.5);
            sun.position.set(3, 4, 2);
            scene.add(sun);

            const nisarGroup = new THREE.Group();
            nisarGroup.scale.set(0.82, 0.82, 0.82);
            scene.add(nisarGroup);

            // Gold Spacecraft Bus
            const bus = new THREE.Mesh(
                new THREE.BoxGeometry(0.35, 0.25, 0.45),
                new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.85, roughness: 0.25 })
            );
            nisarGroup.add(bus);

            // Solar Array Wings
            const solarMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.3, metalness: 0.6 });
            const wL = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.02, 0.22), solarMat);
            wL.position.set(-0.55, 0, 0);
            nisarGroup.add(wL);
            const wR = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.02, 0.22), solarMat);
            wR.position.set(0.55, 0, 0);
            nisarGroup.add(wR);

            // Deployable Boom
            const boom = new THREE.Mesh(
                new THREE.CylinderGeometry(0.025, 0.025, 1.1, 8),
                new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 })
            );
            boom.position.set(0.2, 0.6, -0.2);
            boom.rotation.z = -Math.PI * 0.18;
            boom.rotation.x = Math.PI * 0.12;
            nisarGroup.add(boom);

            // 12-meter Mesh Radar Reflector Drum
            const refGroup = new THREE.Group();
            refGroup.position.set(0.38, 1.15, -0.32);
            refGroup.rotation.x = Math.PI * 0.35;
            refGroup.rotation.y = Math.PI * 0.15;

            const disk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.55, 0.55, 0.18, 20, 3, true),
                new THREE.MeshStandardMaterial({ color: 0x94a3b8, wireframe: true, transparent: true, opacity: 0.85 })
            );
            refGroup.add(disk);

            const dishBase = new THREE.Mesh(
                new THREE.CircleGeometry(0.53, 20),
                new THREE.MeshBasicMaterial({ color: 0x64748b, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
            );
            dishBase.rotation.x = Math.PI / 2;
            dishBase.position.y = -0.05;
            refGroup.add(dishBase);

            nisarGroup.add(refGroup);

            function renderNisar() {
                nisarGroup.rotation.y += 0.015;
                renderer.render(scene, camera);
                requestAnimationFrame(renderNisar);
            }
            renderNisar();

            return container;
        }

        const nisarMarker = new maplibregl.Marker({
            element: createNisar3DElement(),
            anchor: 'center'
        }).setLngLat([0, 0]).addTo(map);

        let orbitTime = 0;
        let currentNisarLng = 0;
        let currentNisarLat = 0;
        const orbitInclination = 98.4 * (Math.PI / 180);

        function updateNisarOrbit() {
            orbitTime += 0.0035;
            const u = orbitTime;
            const latRad = Math.asin(Math.sin(orbitInclination) * Math.sin(u));
            const lat = latRad * (180 / Math.PI);
            let lng = (Math.atan2(Math.cos(orbitInclination) * Math.sin(u), Math.cos(u)) * (180 / Math.PI)) - (orbitTime * 28);
            lng = ((lng + 180) % 360 + 360) % 360 - 180;
            currentNisarLng = lng;
            currentNisarLat = lat;
            nisarMarker.setLngLat([lng, lat]);
            requestAnimationFrame(updateNisarOrbit);
        }
        updateNisarOrbit();


        // ========================================================
        // 17. NISAR SATELLITE HORIZON CULLING
        // ========================================================
        function updateSatelliteOcclusion() {
            const center = map.getCenter();
            const cLat = center.lat * Math.PI / 180, cLng = center.lng * Math.PI / 180;
            const nLat = currentNisarLat * Math.PI / 180, nLng = currentNisarLng * Math.PI / 180;
            const cos = Math.sin(cLat) * Math.sin(nLat) + Math.cos(cLat) * Math.cos(nLat) * Math.cos(nLng - cLng);
            const el = nisarMarker.getElement();
            if (el) el.style.display = cos < -0.1 ? 'none' : 'block';
        }
        map.on('move', updateSatelliteOcclusion);
        map.on('render', updateSatelliteOcclusion);

        // ========================================================
        // 18. START
        // ========================================================
        window.disasterApp = {
            map,
            selectCountry: (name) => {
                const f = countriesData && countriesData.features.find(x => norm(countryName(x)) === norm(name));
                if (f) selectArea({ kind: 'country', name: countryName(f), feature: f });
                return !!f;
            },
            openRadar,
            events: () => (state.area && state.area.events) || [],
            apiEvents: () => apiEvents,
            state,
            radar: () => radar
        };
        updateDock();
        loadApi();

        // ========================================================
        // 10. DRAGGABLE TRANSLUCENT BOTTOM DOCK
        // ========================================================
        const dockEl = document.getElementById('bottom-disasters-bar');
        const dragBarEl = document.getElementById('dock-drag-bar');

        let isDraggingDock = false;
        let dragStartX, dragStartY, dockInitialLeft, dockInitialTop;

        dragBarEl.addEventListener('pointerdown', (e) => {
            isDraggingDock = true;
            dragBarEl.setPointerCapture(e.pointerId);
            dragBarEl.style.cursor = 'grabbing';

            const rect = dockEl.getBoundingClientRect();
            // Switch from transform centering to absolute pixel placement
            dockEl.style.transform = 'none';
            dockEl.style.left = `${rect.left}px`;
            dockEl.style.top = `${rect.top}px`;
            dockEl.style.bottom = 'auto';

            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dockInitialLeft = rect.left;
            dockInitialTop = rect.top;
            e.preventDefault();
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDraggingDock) return;
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;

            let newLeft = dockInitialLeft + dx;
            let newTop = dockInitialTop + dy;

            // Clamp within screen boundaries
            const dockWidth = dockEl.offsetWidth;
            const dockHeight = dockEl.offsetHeight;
            newLeft = Math.max(12, Math.min(window.innerWidth - dockWidth - 12, newLeft));
            newTop = Math.max(12, Math.min(window.innerHeight - dockHeight - 12, newTop));

            dockEl.style.left = `${newLeft}px`;
            dockEl.style.top = `${newTop}px`;
        });

        window.addEventListener('pointerup', (e) => {
            if (isDraggingDock) {
                isDraggingDock = false;
                dragBarEl.style.cursor = 'grab';
            }
        });
    </script>
