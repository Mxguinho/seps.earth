            addEventLayers();
            try {
                try {
                    const localRes = await fetch('./countries.geojson');
                    if (localRes.ok) countriesData = await localRes.json();
                } catch (e) { /* no local copy */ }
                if (!countriesData) {
                    const remoteRes = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
                    if (remoteRes.ok) countriesData = await remoteRes.json();
                }
                if (countriesData && countriesData.features) {
                    countriesData.features.forEach((f, i) => { f.id = i + 1; f.properties = f.properties || {}; });
                    countryBoxes = countriesData.features.map(f => f.geometry ? boxOfGeom(f.geometry) : null);
                    map.addSource('paises-source', { type: 'geojson', data: countriesData, generateId: false });
                    map.addLayer({
                        id: 'paises-fill', type: 'fill', source: 'paises-source',
                        paint: { 'fill-color': '#00e5ff', 'fill-opacity': 0 }
                    }, 'footprint-fill');
                    map.addLayer({
                        id: 'paises-outline', type: 'line', source: 'paises-source',
                        paint: {
                            'line-color': ['case',
                                ['boolean', ['feature-state', 'selected'], false], '#00e5ff',
                                ['boolean', ['feature-state', 'hover'], false], '#7dd3fc',
                                'rgba(255, 255, 255, 0.22)'],
                            'line-width': ['case',
                                ['boolean', ['feature-state', 'selected'], false], 2.6,
                                ['boolean', ['feature-state', 'hover'], false], 1.8,
                                0.7],
                            'line-opacity': 0.95
                        }
                    }, 'footprint-fill');
                    assignCountries(apiEvents);
                    countCountries();
                    updateCountryTint();
                }
            } catch (err) {
                console.error('Country boundaries failed:', err);
            }
        });

        map.on('mousemove', 'paises-fill', (e) => {
            if (!e.features || !e.features.length) return;
            map.getCanvas().style.cursor = 'pointer';
            const id = e.features[0].id;
            if (hoveredCountryId !== null && hoveredCountryId !== id) map.setFeatureState({ source: 'paises-source', id: hoveredCountryId }, { hover: false });
            hoveredCountryId = id;
            map.setFeatureState({ source: 'paises-source', id }, { hover: true });
        });
        map.on('mouseleave', 'paises-fill', () => {
            map.getCanvas().style.cursor = '';
            if (hoveredCountryId !== null) map.setFeatureState({ source: 'paises-source', id: hoveredCountryId }, { hover: false });
            hoveredCountryId = null;
        });

        function highlightCountry(id) {
            if (selectedCountryId !== null) map.setFeatureState({ source: 'paises-source', id: selectedCountryId }, { selected: false });
            selectedCountryId = id;
            if (id !== null && map.getSource('paises-source')) map.setFeatureState({ source: 'paises-source', id }, { selected: true });
        }

        // Hover tooltip on points
        const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: 'hazard-popup', offset: 12 });
        map.on('mousemove', 'hazard-points', (e) => {
            const f = e.features && e.features[0];
            const ev = f && eventsByKey.get(f.properties.key);
            if (!ev) return;
            map.getCanvas().style.cursor = 'pointer';
            hoverPopup.setLngLat([ev.lon, ev.lat])
                .setHTML(`<strong>${esc(ev.title)}</strong><br>${esc(CATS[ev.cat].name)} · ${esc(fmtDate(ev.time, false))}`)
                .addTo(map);
        });
        map.on('mouseleave', 'hazard-points', () => { map.getCanvas().style.cursor = ''; hoverPopup.remove(); });

        // ========================================================
        // 8. LOAD THE DISASTER API (reference database)
        // ========================================================
        const statusEl = document.getElementById('data-status');
        const hintEl = document.getElementById('globe-hint');

        function setStatus(html, { error = false } = {}) {
            statusEl.innerHTML = html;
            statusEl.classList.toggle('error', error);
        }

        function idleStatus() {
            const n = apiEvents.length;
            setStatus(`<strong>${fmtNum(n, 0)} events</strong> in the Disaster API database (NASA EONET and USGS, South America).
                <div class="muted" style="margin-top:6px">Click any country on the globe, or search for one. Other continents load live from NASA EONET and USGS.</div>`);
        }

        async function loadApi() {
            setStatus(`<div class="status-row"><div class="spinner"></div><span>Loading the Disaster API...</span></div>`);
            try {
                const data = await apiFetch('/api/dados', { timeout: 45000 });
                apiEvents = [];
                apiByKey.clear();
                (data.dados || []).forEach(r => {
                    const ev = fromApi(r);
                    if (ev && !apiByKey.has(ev.key)) { apiEvents.push(ev); apiByKey.set(ev.key, ev); eventsByKey.set(ev.key, ev); }
                });
                const times = apiEvents.map(e => e.time).filter(Boolean).sort();
                if (times.length) apiStart = times[0].slice(0, 10);
                assignCountries(apiEvents);
                countCountries();
                updateDock();
                if (!state.area) idleStatus();
            } catch (err) {
                console.error('Disaster API failed:', err);
                setStatus(`Could not reach the Disaster API (${esc(err.message)}). Live data from NASA EONET and USGS still works.
                    <div style="margin-top:6px"><button class="link-btn" id="retry-api">Try again</button></div>`, { error: true });
                document.getElementById('retry-api').addEventListener('click', loadApi);
            }
        }

        // ========================================================
        // 9. SELECT AN AREA (country or a point in the ocean)
        //    Points appear only after this, so the globe stays clean.
        // ========================================================
        const liveCache = new Map();   // "<area>|<start>" -> { events, sources }

        async function queryLive(boxes, start, { center = null } = {}) {
            const end = ymd(Date.now() + 864e5);
            const sources = { eonet: { ok: true, n: 0 }, usgs: { ok: true, n: 0 } };
            const out = [];
            const jobs = boxes.map(async ([w, s, e, n]) => {
                const [eonet, usgs] = await Promise.allSettled([
                    fetchJson(`${EONET_BASE}/events?status=all&start=${start}&end=${end}&bbox=${w},${n},${e},${s}`, { timeout: 25000 }),
                    fetchJson(`${USGS_QUERY}?format=geojson&starttime=${start}&endtime=${end}&minmagnitude=${USGS_MIN_MAG}` +
                        `&minlatitude=${s}&maxlatitude=${n}&minlongitude=${w}&maxlongitude=${e}&orderby=time&limit=2000`, { timeout: 20000 })
                ]);
                if (eonet.status === 'fulfilled') {
                    (eonet.value.events || []).forEach(raw => { const ev = fromEonet(raw, start + 'T00:00:00Z'); if (ev) out.push([ev, raw]); });
                } else { sources.eonet.ok = false; sources.eonet.err = eonet.reason.message; }
                if (usgs.status === 'fulfilled') {
                    ((usgs.value && usgs.value.features) || []).forEach(raw => { const ev = fromUsgs(raw); if (ev) out.push([ev, raw]); });
                } else { sources.usgs.ok = false; sources.usgs.err = usgs.reason.message; }
            });
            await Promise.all(jobs);
            return { pairs: out, sources };
        }

        async function selectArea(area) {
            const token = ++state.loadToken;
            state.area = area;
            markSelected(null);
            hintEl.style.opacity = '0';
            document.getElementById('country-clear').style.display = '';
            document.getElementById('country-input').value = area.kind === 'country' ? area.name : '';

            if (area.kind === 'country') {
                highlightCountry(area.feature.id);
                markClick(null);
                const b = countryBoxes[area.feature.id - 1];
                if (b && b[2] - b[0] < 180) map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: { top: 100, bottom: 160, left: 400, right: 440 }, maxZoom: 6, duration: 1200 });
            } else {
                highlightCountry(null);
                markClick(area.lon, area.lat);
            }

            const start = periodStart();
            const label = area.kind === 'country' ? esc(area.name) : 'this area';
            setStatus(`<div class="status-row"><div class="spinner"></div><span>Loading ${label}: Disaster API, NASA EONET and USGS...</span></div>`);
            setPoints([]);
            openAreaCard(area, null);

            // 1) Disaster API events of this area (already loaded)
            const inArea = ev => area.kind === 'country'
                ? ev.countryId === area.feature.id
                : haversineKm(area.lat, area.lon, ev.apiLat ?? ev.lat, ev.apiLon ?? ev.lon) <= NEARBY_KM;
            const fromDb = apiEvents.filter(ev => ev.time >= start && inArea(ev));

            // 2) Live official sources for the same area and period
            const cacheKey = `${area.kind === 'country' ? area.feature.id : `${area.lat.toFixed(2)},${area.lon.toFixed(2)}`}|${start}`;
            let live = liveCache.get(cacheKey);
            if (!live) {
                const boxes = area.kind === 'country'
                    ? boxGroups(area.feature.geometry)
                    : [[area.lon - 3, Math.max(-89, area.lat - 2.7), area.lon + 3, Math.min(89, area.lat + 2.7)]];
                live = await queryLive(boxes, start);
                if (token !== state.loadToken) return;
                liveCache.set(cacheKey, live);
            }
            if (token !== state.loadToken) return;

            // 3) Merge and verify (same id in two sources = one event, compared field by field)
            const merged = new Map(fromDb.map(ev => [ev.key, ev]));
            let liveInArea = 0, matched = 0;
            live.pairs.forEach(([ev, raw]) => {
                const twin = apiByKey.get(ev.key);
                if (twin) {
                    if (!merged.has(twin.key) && !(twin.time >= start && inArea(twin))) return;
                    mergeLive(ev, raw);
                    merged.set(twin.key, twin);
                    liveInArea++; matched++;
                    return;
                }
                const existing = eventsByKey.get(ev.key);
                const use = existing && !existing.inApi ? existing : ev;
                if (!existing) {
                    mergeLive(use, raw);
                    eventsByKey.set(use.key, use);
                }
                if (!use.country && countriesData) {
                    const f = countryOf(use.lon, use.lat);
                    use.country = f ? countryName(f) : null;
                    use.countryId = f ? f.id : null;
                }
                const ok = area.kind === 'country'
                    ? use.countryId === area.feature.id
                    : haversineKm(area.lat, area.lon, use.lat, use.lon) <= NEARBY_KM;
                if (ok && use.time >= start) { merged.set(use.key, use); liveInArea++; }
            });
            fromDb.forEach(ev => { if (!ev.live && !ev.check) ev.check = { status: 'pending', rows: [] }; });

            const events = [...merged.values()].sort((a, b) => String(b.time).localeCompare(String(a.time)));
            area.events = events;
            area.sources = { ...live.sources, db: fromDb.length, matched, live: liveInArea };
            area.start = start;

            setPoints(events);
            updateDock();
            areaStatus();
            openAreaCard(area, events);
            hintEl.style.display = 'none';
        }

        function visibleEvents() {
            const list = (state.area && state.area.events) || [];
            return state.cat === 'all' ? list : list.filter(ev => ev.cat === state.cat);
        }

        function areaStatus() {
            const a = state.area;
            if (!a || !a.events) return;
            const vis = visibleEvents();
            const what = state.cat === 'all' ? plural(vis.length, 'event') : plural(vis.length, `${CATS[state.cat].one} event`);
            const where = a.kind === 'country' ? esc(a.name) : `within ${NEARBY_KM} km`;
            const s = a.sources;
            const chip = (ok, label, n, err) => `<span class="chip" title="${esc(err || '')}"><span class="dot" style="--c:${ok ? 'var(--good)' : 'var(--warn)'}"></span>${label}${ok ? ` ${fmtNum(n, 0)}` : ' offline'}</span>`;
            setStatus(`<strong>${where}</strong>: ${what} ${PERIOD_TEXT[state.period]}.
                <div class="source-chips">
                    ${chip(true, 'Disaster API', s.db)}
                    ${chip(s.eonet.ok && s.usgs.ok, 'Live NASA/USGS', s.live, [s.eonet.err, s.usgs.err].filter(Boolean).join(' / '))}
                    <span class="chip"><span class="dot" style="--c:var(--accent)"></span>Matched ${fmtNum(s.matched, 0)}</span>
                </div>
                <div style="margin-top:8px"><button class="link-btn" id="area-clear">Clear selection</button></div>`,
                { error: !(s.eonet.ok && s.usgs.ok) });
            document.getElementById('area-clear').addEventListener('click', clearArea);
        }

        function clearArea() {
            state.loadToken++;
            state.area = null;
            setPoints([]);
            markSelected(null);
            markClick(null);
            highlightCountry(null);
            closeCard();
            document.getElementById('country-input').value = '';
            document.getElementById('country-clear').style.display = 'none';
            updateDock();
            idleStatus();
        }

        // ========================================================
        // 10. LEFT PANEL: country search + period
        // ========================================================
        const countryInput = document.getElementById('country-input');
        const countryList = document.getElementById('country-list');
        let countryOptions = [];   // [{id, name, n}]
        let activeOption = -1;

        function norm(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

        function buildCountryList() {
            if (!countriesData) return;
            countryOptions = countriesData.features
                .map(f => ({ id: f.id, name: countryName(f), n: f.properties._n_all || 0 }))
                .filter(o => o.name && o.name !== 'Unknown')
                .sort((a, b) => (b.n > 0) - (a.n > 0) || b.n - a.n || a.name.localeCompare(b.name));
        }

        function renderCountryList() {
            const q = norm(countryInput.value.trim());
            const list = countryOptions.filter(o => !q || norm(o.name).includes(q)).slice(0, 80);
            const withData = list.filter(o => o.n > 0), rest = list.filter(o => o.n === 0);
            activeOption = list.length ? 0 : -1;
            const opt = (o, i) => `<button class="combo-option${i === activeOption ? ' active' : ''}" role="option" data-id="${o.id}">
                <span>${esc(o.name)}</span><span class="count">${o.n ? `${fmtNum(o.n, 0)} in database` : 'live data'}</span></button>`;
            let i = 0;
            countryList.innerHTML =
                (withData.length ? `<div class="combo-group">In the Disaster API</div>${withData.map(o => opt(o, i++)).join('')}` : '') +
                (rest.length ? `<div class="combo-group">Other countries (live NASA EONET and USGS)</div>${rest.map(o => opt(o, i++)).join('')}` : '') +
                (!list.length ? `<div class="combo-group">No country matches "${esc(countryInput.value)}"</div>` : '');
            countryList.classList.add('open');
            countryInput.setAttribute('aria-expanded', 'true');
        }

        function pickCountry(id) {
            const f = countriesData && countriesData.features[id - 1];
            countryList.classList.remove('open');
            countryInput.setAttribute('aria-expanded', 'false');
            if (f) selectArea({ kind: 'country', name: countryName(f), feature: f });
        }

        countryInput.addEventListener('focus', () => { if (countriesData) renderCountryList(); });
        countryInput.addEventListener('input', () => { if (countriesData) renderCountryList(); });
        countryInput.addEventListener('keydown', (e) => {
            const opts = [...countryList.querySelectorAll('.combo-option')];
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!opts.length) return;
                activeOption = (activeOption + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
                opts.forEach((o, i) => o.classList.toggle('active', i === activeOption));
                opts[activeOption].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (opts[activeOption]) pickCountry(Number(opts[activeOption].dataset.id));
            } else if (e.key === 'Escape') {
                countryList.classList.remove('open');
            }
        });
        countryList.addEventListener('mousedown', (e) => {
            const b = e.target.closest('.combo-option');
            if (b) { e.preventDefault(); pickCountry(Number(b.dataset.id)); }
        });
        countryInput.addEventListener('blur', () => setTimeout(() => countryList.classList.remove('open'), 120));
        document.getElementById('country-clear').addEventListener('click', clearArea);

        document.querySelectorAll('#period-control button').forEach(btn => {
            btn.addEventListener('click', () => {
                state.period = btn.dataset.period;
                document.querySelectorAll('#period-control button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
                if (state.area) selectArea({ ...state.area, events: null });
                else updateDock();
            });
        });

        // ========================================================
        // 11. BOTTOM DOCK: type of disaster (filter + legend)
        // ========================================================
        const dockGrid = document.getElementById('dock-grid');
        dockGrid.innerHTML = DOCK.map(slug => `
            <button class="disaster-col" data-cat="${slug}" aria-pressed="false" style="--c:${CATS[slug].color}" title="Show only ${CATS[slug].name.toLowerCase()}">
                <span class="disaster-name"><span class="dot" style="--c:${CATS[slug].color}"></span>${CATS[slug].name}</span>
                <span class="disaster-desc" data-desc="${slug}">${CATS[slug].desc}</span>
            </button>`).join('');

        function updateDock() {
            const inArea = !!(state.area && state.area.events);
            const start = periodStart();
            const list = inArea ? state.area.events : apiEvents.filter(ev => ev.time >= start);
            const counts = {};
            list.forEach(ev => { counts[ev.cat] = (counts[ev.cat] || 0) + 1; });
            dockGrid.querySelectorAll('.disaster-col').forEach(col => {
                const slug = col.dataset.cat, n = counts[slug] || 0;
                col.querySelector('.disaster-desc').textContent = inArea ? `${fmtNum(n, 0)} here` : `${fmtNum(n, 0)} in database`;
                col.classList.toggle('empty', n === 0);
                col.setAttribute('aria-pressed', String(state.cat === slug));
            });
        }

        dockGrid.addEventListener('click', (e) => {
            const col = e.target.closest('.disaster-col');
            if (!col) return;
            state.cat = state.cat === col.dataset.cat ? 'all' : col.dataset.cat;
            applyCategoryFilter();
            updateDock();
            if (state.area && state.area.events) {
                areaStatus();
                if (!state.selectedKey) openAreaCard(state.area, state.area.events);
                const sel = state.selectedKey && eventsByKey.get(state.selectedKey);
                if (sel && state.cat !== 'all' && sel.cat !== state.cat) openAreaCard(state.area, state.area.events);
            }
        });

        // ========================================================
        // 12. RIGHT CARD: area summary / one event
        // ========================================================
        const card = document.getElementById('detail-card');
        let cardToken = 0;

        function closeCard() {
            cardToken++;
            card.style.display = 'none';
            markSelected(null);
        }

        function showCard(html) {
            card.innerHTML = html;
            card.style.display = 'flex';
        }

        function eventRow(ev) {
            return `<button class="event-link" data-key="${esc(ev.key)}">
                <span class="dot" style="--c:${CATS[ev.cat].color}"></span>
                <span>${esc(ev.title)}<small>${esc(CATS[ev.cat].name)} · ${esc(fmtDate(ev.time, false))}${ev.inApi ? ' · in database' : ''}</small></span>
            </button>`;
        }

        function openAreaCard(area, events) {
            cardToken++;
            markSelected(null);
            const title = area.kind === 'country' ? area.name : 'Selected point';
            const sub = area.kind === 'country'
                ? (area.feature.properties['ISO3166-1-Alpha-3'] || area.feature.properties.ISO_A3 || '')
                : `${fmtLat(area.lat)}, ${fmtLon(area.lon)} · within ${NEARBY_KM} km`;
            const head = `<div class="card-head">
                    <div><div class="card-kicker">${icon(area.kind === 'country' ? 'globe' : 'pin')} ${area.kind === 'country' ? 'Country' : 'Ocean or border area'}</div>
                    <div class="card-title">${esc(title)}</div><div class="card-sub">${esc(sub)}</div></div>
                    <button class="close-btn" data-action="close" aria-label="Close">${icon('close')}</button>
                </div>`;
            if (!events) {
                showCard(`${head}<div class="status-row muted"><div class="spinner"></div>Gathering events from 3 sources...</div>`);
                return;
            }
            const vis = state.cat === 'all' ? events : events.filter(ev => ev.cat === state.cat);
            const counts = {};
            events.forEach(ev => { counts[ev.cat] = (counts[ev.cat] || 0) + 1; });
            const max = Math.max(1, ...Object.values(counts));
            const cats = [...DOCK, 'other'].filter(c => counts[c]);
            const verified = events.filter(ev => ev.check && (ev.check.status === 'verified' || ev.check.status === 'adjusted')).length;

            showCard(`${head}
                <div class="facts">
                    <div class="fact"><div class="fact-label">${icon('calendar')} Period</div><div class="fact-value">${esc(fmtDay(area.start))} to today</div></div>
                    <div class="fact"><div class="fact-label">${icon('layers')} Events found</div><div class="fact-value">${fmtNum(events.length, 0)}</div></div>
                </div>
                ${events.length ? `
                <div class="section">
                    <div class="section-title">Events by type</div>
                    <div class="bar-list">${cats.map(c => `
                        <div class="bar-row">
                            <span class="bar-label"><span class="dot" style="--c:${CATS[c].color}"></span>${CATS[c].name}</span>
                            <span class="bar-track"><span class="bar-fill" style="display:block;width:${(counts[c] / max * 100).toFixed(1)}%;--c:${CATS[c].color}"></span></span>
                            <span class="bar-value">${fmtNum(counts[c], 0)}</span>
                        </div>`).join('')}
                    </div>
                </div>
                <div class="note" style="--nc:var(--good)">
                    <strong>${fmtNum(verified, 0)}</strong> of these events were found in both the Disaster API and the official live feed, with matching dates and positions.
                    ${area.sources.db - area.sources.matched > 0 ? `${fmtNum(area.sources.db - area.sources.matched, 0)} more are checked one by one when you open them.` : ''}
                </div>
                <div class="section">
                    <div class="section-title">${state.cat === 'all' ? 'Most recent' : `Most recent ${CATS[state.cat].name.toLowerCase()}`}</div>
                    <div class="event-list">${vis.slice(0, 8).map(eventRow).join('') || '<div class="muted">None for this type. Choose another type in the bar below.</div>'}</div>
                    <div class="muted">Tip: click any point on the globe to open it.</div>
                </div>` : `
                <div class="note">No disasters were recorded here ${PERIOD_TEXT[state.period]}. Try a longer period in the left panel.</div>`}
            `);
        }

        card.addEventListener('click', (e) => {
            if (e.target.closest('[data-action="close"]')) {
                if (state.selectedKey && state.area && state.area.events) openAreaCard(state.area, state.area.events);
                else { closeCard(); if (state.area && !state.area.events) clearArea(); }
                return;
            }
            if (e.target.closest('[data-action="back"]')) { openAreaCard(state.area, state.area.events); return; }
            if (e.target.closest('[data-action="radar"]')) {
                const ev = eventsByKey.get(state.selectedKey);
                if (ev) openRadar(ev);
                return;
            }
            const link = e.target.closest('.event-link');
            if (link) selectEvent(eventsByKey.get(link.dataset.key));
        });

        function selectEvent(ev) {
            if (!ev) return;
            markSelected(ev.key);
            hoverPopup.remove();
            map.flyTo({ center: [ev.lon, ev.lat], zoom: Math.max(map.getZoom(), ev.footprint ? 7 : 5), pitch: 25, essential: true });
            openEventCard(ev);
        }

        function checkBlock(ev) {
            const chk = ev.check || { status: 'pending', rows: [] };
            const [cls, label] = CHECK_BADGE[chk.status] || CHECK_BADGE.unavailable;
            const ic = { ok: 'check', warn: 'alert', bad: 'cross', info: 'info' };
            return `<div class="section">
                <div class="section-title" style="justify-content:space-between">
                    <span style="display:flex;align-items:center;gap:8px">${icon('shield')} Is this data reliable?</span>
                    <span class="badge ${cls}">${label}</span>
                </div>
                ${chk.rows.length ? `<div class="check-list">${chk.rows.map(r => `<div class="check ${r.s}">${icon(ic[r.s])}<span>${esc(r.t)}</span></div>`).join('')}</div>`
                    : '<div class="status-row muted"><div class="spinner"></div>Comparing with the official source...</div>'}
            </div>`;
        }

        function radarBlockHtml(ev, plan, err) {
            if (err) return `<div class="note" style="--nc:var(--info)">${esc(err)}</div>`;
            if (!plan) return `<div class="status-row muted"><div class="spinner"></div>Looking for NISAR radar images of this place...</div>`;
            const s = RADAR_STATUS[plan.status] || RADAR_STATUS.default;
            const pair = plan.before && plan.after;
            return `<div class="note" style="--nc:${s.color}">
                    <strong>${esc(s.title)}</strong><br>${pair
                    ? `Before: <strong>${esc(fmtDay(plan.before))}</strong> · After: <strong>${esc(fmtDay(plan.after))}</strong>. ${plural(plan.n_cenas || 0, 'satellite pass', 'satellite passes')} found around the event.`
                    : esc(s.text(plan))}
                </div>
                <div class="btn-row"><button class="btn${pair ? ' primary' : ''}" data-action="radar">${icon('radar')} ${pair ? 'Compare radar images' : 'See radar details'}</button></div>`;
        }

        async function openEventCard(ev) {
            const token = ++cardToken;
            const size = fmtSize(ev);
            const render = (plan, planErr) => {
                if (token !== cardToken) return;
                showCard(`
                <div class="card-head">
                    <div>
                        <div class="card-kicker"><span class="dot" style="--c:${CATS[ev.cat].color}"></span>${esc(CATS[ev.cat].one)}</div>
                        <div class="card-title">${esc(ev.title)}</div>
                        <div class="card-sub">${esc(ev.country || 'Ocean or international waters')}</div>
                    </div>
                    <button class="close-btn" data-action="close" aria-label="Back to the area">${icon('close')}</button>
                </div>
                <div class="facts">
                    <div class="fact"><div class="fact-label">${icon('calendar')} Date</div><div class="fact-value">${esc(fmtDate(ev.time))}</div></div>
                    <div class="fact"><div class="fact-label">${icon('pin')} Location</div><div class="fact-value">${esc(fmtLat(ev.lat))}<br>${esc(fmtLon(ev.lon))}</div></div>
                    ${size ? `<div class="fact"><div class="fact-label">${icon('ruler')} ${esc(size.label)}</div><div class="fact-value">${esc(size.value)}</div></div>` : ''}
                    <div class="fact"><div class="fact-label">${icon('clock')} Status</div><div class="fact-value">${ev.closed === null ? 'Ongoing' : ev.closed ? `Ended ${esc(fmtDate(ev.closed, false))}` : 'Recorded'}</div></div>
                </div>
                ${checkBlock(ev)}
                <div class="section">
                    <div class="section-title">${icon('radar')} Satellite radar (NISAR)</div>
                    ${radarBlockHtml(ev, plan, planErr)}
                </div>
                <div class="section">
                    <div class="section-title">${icon('alert')} Staying safe</div>
                    <div class="tip-box">${esc(CATS[ev.cat].tips)}</div>
                </div>
                ${ev.links.length ? `<div class="src-links">${ev.links.slice(0, 3).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${icon('external')} ${esc(l.label)}</a>`).join('')}</div>` : ''}
                <div class="muted">Source: ${ev.source === 'usgs' ? 'USGS' : 'NASA EONET'} · ID ${esc(ev.eventId)}${ev.inApi ? ' · Disaster API' : ''}</div>
            `);
            };
            render(null);

            // Verify against the official source (by ID) if the area query did not cover it
            if (ev.inApi && !ev.live) {
                await verifyById(ev);
                if (token !== cardToken) return;
                markSelected(ev.key);   // the footprint may have appeared
                setPoints(state.area && state.area.events ? state.area.events : [ev]);
                render(null);
            }
            try {
                const plan = await radarPlan(ev);
                render(plan);
            } catch (err) {
                render(null, radarErrorText(err));
            }
        }

        // ========================================================
        // 13. GLOBE CLICK
        // ========================================================
        map.on('click', (e) => {
            if (map.getLayer('hazard-points')) {
                const box = [[e.point.x - 7, e.point.y - 7], [e.point.x + 7, e.point.y + 7]];
                const hits = map.queryRenderedFeatures(box, { layers: ['hazard-points'] });
                if (hits.length) {
                    let best = null, bestD = Infinity;
                    hits.forEach(h => {
                        const ev = eventsByKey.get(h.properties.key);
                        if (!ev) return;
                        const p = map.project([ev.lon, ev.lat]);
                        const d = (p.x - e.point.x) ** 2 + (p.y - e.point.y) ** 2;
                        if (d < bestD) { bestD = d; best = ev; }
                    });
                    if (best) { selectEvent(best); return; }
                }
            }
            const { lng, lat } = e.lngLat;
            let feature = null;
            try {
                const fs = map.getLayer('paises-fill') ? map.queryRenderedFeatures(e.point, { layers: ['paises-fill'] }) : [];
                if (fs.length && countriesData) feature = countriesData.features[fs[0].id - 1] || null;
            } catch (err) { /* layer not ready */ }
            if (!feature) feature = countryAt(lng, lat);
            if (feature) selectArea({ kind: 'country', name: countryName(feature), feature });
            else selectArea({ kind: 'point', lat, lon: lon180(lng) });
        });

        // ========================================================
        // 14. NISAR RADAR: availability (Disaster API -> NISAR API)
        //     The NISAR API only accepts calls from localhost (CORS), so the site
        //     talks to it through the Disaster API routes /api/eventos/{id}/...
        // ========================================================
        const planCache = new Map();

        const RADAR_STATUS = {
            ok: { color: 'var(--good)', title: 'Radar images available before and after',
                text: () => '' },
            cobertura_baixa: { color: 'var(--warn)', title: 'Radar images available, but they cover only part of the area',
                text: () => '' },
            sem_cenas: { color: 'var(--info)', title: 'No NISAR images of this place yet',
                text: p => `NISAR has not imaged this spot between ${fmtDay(p.janela && p.janela.inicio)} and ${fmtDay(p.janela && p.janela.fim)}. NISAR science data is public from mid-2026, and older images are still being released.` },
            sem_cena_antes: { color: 'var(--info)', title: 'No radar image from before the event',
                text: p => `NISAR passed here ${plural(p.n_cenas || 0, 'time')}, but only after the event, so there is no "before" picture to compare with.` },
            sem_cena_depois: { color: 'var(--info)', title: 'No radar image from after the event yet',
                text: p => `NISAR passed here ${plural(p.n_cenas || 0, 'time')}, but only before the event. The satellite returns about every 12 days, so an "after" image may still come.` },
            sem_par_compativel: { color: 'var(--info)', title: 'No matching before/after pair',
                text: () => 'There are images before and after the event, but taken from different orbits. The radar would see the ground from different angles, so the comparison would not be fair.' },
            default: { color: 'var(--info)', title: 'Radar status unknown', text: p => `Status: ${p.status}` }
        };

        // Events from other continents are registered by source + ID; the API re-reads them from EONET/USGS
        async function ensureRecord(ev) {
            if (ev.recordId) return ev.recordId;
            try {
                const r = await apiFetch('/api/eventos/externo', {
                    method: 'POST',
                    body: { fonte: ev.source, id: ev.eventId, data: ev.source === 'eonet' ? ev.time : undefined }
                });
                ev.recordId = r.record_id;
                return ev.recordId;
            } catch (err) {
                if (err.status === 405 || (err.status === 404 && err.detail === 'Not Found')) {
                    const e = new Error('needs-update'); e.code = 'needs-update'; throw e;
                }
                throw err;
            }
        }

        async function radarPlan(ev) {
            if (planCache.has(ev.key)) return planCache.get(ev.key);
            const rid = await ensureRecord(ev);
            const plan = await apiFetch(`/api/eventos/${encodeURIComponent(rid)}/sar/cenas`, { timeout: 45000 });
            planCache.set(ev.key, plan);
            return plan;
        }

        function radarErrorText(err) {
            if (err.code === 'needs-update') return 'Radar comparison for events outside the Disaster API database needs the API update (route /api/eventos/externo).';
            if (err.status === 422) {
                if (/latitude/i.test(err.detail || '')) return 'NISAR analysis only covers latitudes between 60° S and 60° N.';
                return `The radar service cannot analyse this place: ${err.detail || err.message}`;
            }
            return `Could not reach the radar service (${err.message}).`;
        }

        // NISAR file name -> orbit, time and polarization (plain-language technical details)
        function parseScene(name) {
            const m = /GCOV_(\d{3})_(\d{3})_([AD])_(\d{3})_\d{4}_([A-Z]{4})_[A-Z]_(\d{8})T(\d{6})/.exec(name || '');
            if (!m) return null;
            const pol = { DHDH: 'HH + HV (dual)', SHNA: 'HH (single)', QPQP: 'Quad (full)', DVDV: 'VV + VH (dual)' }[m[5]] || m[5];
            return {
                cycle: Number(m[1]), track: Number(m[2]), dir: m[3] === 'A' ? 'ascending' : 'descending', frame: Number(m[4]),
                pol, time: `${m[7].slice(0, 2)}:${m[7].slice(2, 4)} UTC`
            };
        }

        // ========================================================
        // 15. TABS
        // ========================================================
        const radarView = document.getElementById('radar-view');
        const radarWrap = document.getElementById('radar-wrap');
        const tabGlobe = document.getElementById('tab-globe');
        const tabRadar = document.getElementById('tab-radar');

        function setTab(tab) {
            const radarOn = tab === 'radar';
            tabGlobe.setAttribute('aria-selected', String(!radarOn));
            tabRadar.setAttribute('aria-selected', String(radarOn));
            radarView.classList.toggle('open', radarOn);
            if (radarOn) {
                if (!radar.ev) renderPicker();
                radarView.scrollTop = 0;
            }
            if (!radarOn && radar.map) radar.map.resize();
        }
        tabGlobe.addEventListener('click', () => setTab('globe'));
        tabRadar.addEventListener('click', () => setTab('radar'));

        // ========================================================
        // 16. RADAR TAB STATE
        // ========================================================
        const radar = {
            ev: null, plan: null, planErr: null,
            job: null, jobState: null, jobErr: null, jobInfo: null,
            result: null, rasters: null, rasterErr: null,
            layer: 'change', opacity: 0.85,
            map: null, poll: null, token: 0
        };

        function resetRadar() {
            radar.token++;
            clearInterval(radar.poll);
            radar.poll = null;
            if (radar.map) { radar.map.remove(); radar.map = null; }
            Object.assign(radar, { plan: null, planErr: null, job: null, jobState: null, jobErr: null, jobInfo: null, result: null, rasters: null, rasterErr: null, layer: 'change' });
        }

        async function openRadar(ev) {
            resetRadar();
            radar.ev = ev;
            setTab('radar');
            renderRadarShell();
            const token = radar.token;
            try {
                radar.plan = await radarPlan(ev);
            } catch (err) {
                radar.planErr = radarErrorText(err);
            }
            if (token !== radar.token) return;
            renderStep2();
            renderStep3();
            if (radar.plan && ev.recordId) await refreshJob(true);
        }

        // ---------- shell ----------
        function renderRadarShell() {
            const ev = radar.ev;
            const size = fmtSize(ev);
            const chk = ev.check && CHECK_BADGE[ev.check.status];
            radarWrap.innerHTML = `
                <div class="radar-top">
                    <div>
                        <button class="btn" data-r="back">${icon('back')} Back to the globe</button>
                        <h1 style="margin-top:14px">Radar comparison</h1>
                        <p>How did the ground change after this ${esc(CATS[ev.cat].one)}? NISAR, the NASA and ISRO radar satellite, sees through clouds and works day and night.</p>
                    </div>
                    <button class="btn" data-r="choose">${icon('search')} Choose another event</button>
                </div>

                <section class="step" aria-labelledby="s1">
                    <div class="step-head">
                        <div class="step-title" id="s1"><span class="step-num">1</span>What happened</div>
                        ${chk ? `<span class="badge ${chk[0]}">${icon('shield')} ${chk[1]}</span>` : ''}
                    </div>
                    <div style="font-size:20px;font-weight:700">${esc(ev.title)}</div>
                    <div class="facts-4">
                        <div class="fact"><div class="fact-label">${icon('calendar')} Date (UTC)</div><div class="fact-value">${esc(fmtDate(ev.time))}</div></div>
                        <div class="fact"><div class="fact-label">${icon('globe')} Country</div><div class="fact-value">${esc(ev.country || 'Ocean or border area')}</div></div>
                        <div class="fact"><div class="fact-label">${icon('pin')} Location</div><div class="fact-value">${esc(fmtLat(ev.lat))}, ${esc(fmtLon(ev.lon))}</div></div>
                        <div class="fact"><div class="fact-label"><span class="dot" style="--c:${CATS[ev.cat].color}"></span> ${size ? esc(size.label) : 'Type'}</div><div class="fact-value">${size ? esc(size.value) : esc(CATS[ev.cat].name)}</div></div>
                    </div>
                    <div class="muted">Source: ${ev.source === 'usgs' ? 'USGS' : 'NASA EONET'} (ID ${esc(ev.eventId)})${ev.inApi ? ', recorded in the Disaster API database' : ''}${ev.closed ? ` · ended ${esc(fmtDate(ev.closed, false))}` : ev.closed === null ? ' · still ongoing' : ''}.</div>
                </section>

                <section class="step" aria-labelledby="s2">
                    <div class="step-title" id="s2"><span class="step-num">2</span>When the radar passed over</div>
                    <div id="step2"><div class="status-row muted"><div class="spinner"></div>Asking NISAR which images exist around this date...</div></div>
                </section>

                <section class="step" aria-labelledby="s3">
                    <div class="step-title" id="s3"><span class="step-num">3</span>What the radar saw</div>
                    <div id="step3"><div class="muted">Waiting for step 2.</div></div>
                </section>

                <section class="step" aria-labelledby="s4">
                    <div class="step-title" id="s4"><span class="step-num">4</span>Why the radar sees this</div>
                    <div id="step4"></div>
                </section>`;
            renderStep4();
        }

        radarWrap.addEventListener('click', (e) => {
            const b = e.target.closest('[data-r]');
            if (!b) return;
            const a = b.dataset.r;
            if (a === 'back') setTab('globe');
            else if (a === 'choose') { resetRadar(); radar.ev = null; renderPicker(); }
            else if (a === 'run') startAnalysis(false);
            else if (a === 'retry') startAnalysis(true);
            else if (a === 'layer') { radar.layer = b.dataset.layer; renderLayer(); }
            else if (a === 'tech') { const d = document.getElementById('tech-details'); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }
            else if (a === 'pick') { const ev = eventsByKey.get(b.dataset.key); if (ev) openRadar(ev); }
        });

        // ---------- step 2: timeline ----------
        function timelineSvg(plan, ev) {
            const W = 1000, H = 150, ML = 46, MR = 46, Y = 72;
            const d0 = Date.parse(plan.janela.inicio + 'T00:00:00Z'), d1 = Date.parse(plan.janela.fim + 'T00:00:00Z');
            const x = t => ML + (Math.min(Math.max(t, d0), d1) - d0) / Math.max(1, d1 - d0) * (W - ML - MR);
            const scenes = (plan.cenas && plan.cenas.length ? plan.cenas : [plan.cena_antes, plan.cena_depois].filter(Boolean))
                .map(c => ({ ...c, t: Date.parse(String(c.date).slice(0, 10) + 'T00:00:00Z'), orb: c.orbita || (c.chave_orbital ? c.chave_orbital.join('/') : null) }));
            const pairOrb = plan.cena_antes ? (plan.cena_antes.chave_orbital || []).join('/') : null;
            const isPair = c => (String(c.date).slice(0, 10) === plan.before || String(c.date).slice(0, 10) === plan.after) && (!pairOrb || !c.orb || c.orb === pairOrb);
            const evT = Date.parse(ev.time);
            const ex = x(evT);
            const sameDay = {};
            let svg = `<svg class="timeline-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Timeline of NISAR passes around the event">
                <line x1="${ML}" y1="${Y}" x2="${W - MR}" y2="${Y}" stroke="rgba(148,163,184,0.45)" stroke-width="2"/>
                <text x="${ML}" y="${H - 6}" fill="#94a3b8" font-size="13">${esc(fmtDay(plan.janela.inicio, true))}</text>
                <text x="${W - MR}" y="${H - 6}" fill="#94a3b8" font-size="13" text-anchor="end">${esc(fmtDay(plan.janela.fim, true))}</text>
                <line x1="${ex}" y1="${Y - 42}" x2="${ex}" y2="${Y + 22}" stroke="var(--event)" stroke-width="2.5"/>
                <text x="${Math.min(Math.max(ex, 90), W - 90)}" y="${Y - 50}" fill="#fca5a5" font-size="15" font-weight="700" text-anchor="middle">${esc(CATS[ev.cat].name.replace(/s$/, ''))} · ${esc(fmtDay(ev.time.slice(0, 10), true))}</text>`;
            const labelled = [];
            const order = [...scenes].sort((a, b) => isPair(b) - isPair(a));
            order.forEach(c => {
                const cx = x(c.t);
                const k = (sameDay[c.t] = (sameDay[c.t] || 0) + 1) - 1;
                const cy = Y - k * 16;
                const pair = isPair(c);
                const other = pairOrb && c.orb && c.orb !== pairOrb;
                const info = parseScene(c.name);
                const tip = `NISAR pass on ${fmtDay(c.date)}${info ? `, track ${info.track} ${info.dir}, ${info.time}` : ''}${c.coverage !== null && c.coverage !== undefined ? `, covers ${Math.round(c.coverage * 100)}% of the area` : ''}${other ? ' (different orbit: not comparable)' : ''}`;
                svg += `<circle cx="${cx}" cy="${cy}" r="${pair ? 10 : 8}" fill="${pair ? 'var(--radar)' : '#0b1120'}" stroke="${pair ? '#bfdbfe' : other ? 'rgba(148,163,184,0.55)' : '#cbd5e1'}" stroke-width="2"${other ? ' stroke-dasharray="3 3"' : ''}><title>${esc(tip)}</title></circle>`;
                if (k === 0 && (pair || labelled.every(lx => Math.abs(lx - cx) > 48))) {
                    labelled.push(cx);
                    svg += `<text x="${cx}" y="${Y + 30}" fill="${pair ? '#e2e8f0' : '#94a3b8'}" font-size="13" text-anchor="middle">${esc(fmtDay(c.date, true))}</text>`;
                    if (pair) svg += `<text x="${cx}" y="${Y + 48}" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">${String(c.date).slice(0, 10) === plan.before ? 'before' : 'after'}</text>`;
                }
            });
            return svg + '</svg>';
        }

        function renderStep2() {
            const el = document.getElementById('step2');
            if (!el) return;
            const ev = radar.ev, plan = radar.plan;
            if (radar.planErr) { el.innerHTML = `<div class="note" style="--nc:var(--warn)">${esc(radar.planErr)}</div>`; return; }
            if (!plan) return;
            const s = RADAR_STATUS[plan.status] || RADAR_STATUS.default;
            const pair = plan.before && plan.after;
            const bInfo = plan.cena_antes && parseScene(plan.cena_antes.name);
            const aInfo = plan.cena_depois && parseScene(plan.cena_depois.name);
            const hasList = Array.isArray(plan.cenas);
            el.innerHTML = `
                ${plan.n_cenas ? timelineSvg(plan, ev) : ''}
                <div class="legend-row" ${plan.n_cenas ? '' : 'style="display:none"'}>
                    <span class="legend-item"><span class="swatch disc" style="--c:var(--radar)"></span>Pair used in the comparison</span>
                    <span class="legend-item"><span class="swatch ring" style="--c:#cbd5e1"></span>Other passes</span>
                    <span class="legend-item"><span class="swatch" style="--c:var(--event);width:3px;border-radius:1px"></span>Event date</span>
                    ${hasList ? '' : '<span class="legend-item muted">Showing the chosen pair only (the API update also lists every pass)</span>'}
                </div>
                <div class="note" style="--nc:${s.color}">
                    <strong>${esc(s.title)}.</strong>
                    ${pair ? `NISAR passed over this place ${plural(plan.n_cenas || 0, 'time')} between ${esc(fmtDay(plan.janela.inicio))} and ${esc(fmtDay(plan.janela.fim))}.
                        We compare the last pass <strong>before</strong> the event (${esc(fmtDay(plan.before))}) with the first pass <strong>after</strong> it (${esc(fmtDay(plan.after))}).
                        ${bInfo ? `Both were taken from the same orbit (track ${bInfo.track}, ${bInfo.dir} pass), so the radar looked at the ground from the same angle.` : ''}
                        ${plan.status === 'cobertura_baixa' ? ` Only ${Math.round((plan.cobertura_do_par || 0) * 100)}% of the analysis area is covered by both images.` : ''}`
                    : esc(s.text(plan))}
                </div>
                <details class="tech">
                    <summary>Technical details</summary>
                    <table class="kv">
                        <tr><td>Search window</td><td>${esc(plan.janela.inicio)} to ${esc(plan.janela.fim)}</td></tr>
                        <tr><td>Event day (UTC)</td><td>${esc(plan.data_evento)}</td></tr>
                        <tr><td>Passes found</td><td>${esc(plan.n_cenas)}${plan.limite_atingido ? ' (search limit reached)' : ''}</td></tr>
                        <tr><td>Analysis box [W, S, E, N]</td><td>${esc((plan.bbox || []).join(', '))}</td></tr>
                        ${plan.cena_antes ? `<tr><td>Before scene</td><td>${esc(plan.cena_antes.name)}</td></tr>` : ''}
                        ${plan.cena_depois ? `<tr><td>After scene</td><td>${esc(plan.cena_depois.name)}</td></tr>` : ''}
                        ${bInfo ? `<tr><td>Orbit</td><td>track ${bInfo.track}, ${bInfo.dir}, frame ${bInfo.frame}</td></tr>
                            <tr><td>Acquisition time</td><td>before ${esc(bInfo.time)}${aInfo ? `, after ${esc(aInfo.time)}` : ''}</td></tr>
                            <tr><td>Polarization in file</td><td>${esc(bInfo.pol)} · analysis uses HH</td></tr>` : ''}
                        ${pair ? `<tr><td>Coverage of the pair</td><td>${Math.round((plan.cobertura_do_par || 0) * 100)}%</td></tr>` : ''}
                        <tr><td>Product</td><td>NISAR L2 GCOV, L-band (24 cm wavelength)</td></tr>
                    </table>
                </details>`;
        }

        // ---------- step 3: analysis ----------
        const JOB_STATES = {
            na_fila: { color: 'var(--info)', title: 'Waiting in line', text: 'The radar server handles one analysis at a time. Yours will start soon.' },
            processando: { color: 'var(--radar)', title: 'Processing the radar images', text: 'The server is reading both NISAR passes, aligning them and measuring the change. This usually takes a few minutes.' }
        };

        function stateBox(color, title, text, extra = '') {
            return `<div class="state-box" style="--sc:${color}"><div style="flex:1"><h4>${title}</h4><p>${text}</p>${extra}</div></div>`;
        }

        function renderStep3() {
            const el = document.getElementById('step3');
            if (!el) return;
            const ev = radar.ev, plan = radar.plan;
            if (radar.planErr) { el.innerHTML = '<div class="muted">The radar check did not complete, so there is nothing to compare yet.</div>'; return; }
            if (!plan) return;
            const pair = plan.before && plan.after;

            if (radar.jobState === 'concluida') { renderResults(); return; }
            if (radar.jobState === 'na_fila' || radar.jobState === 'processando') {
                const s = JOB_STATES[radar.jobState];
                const since = radar.jobInfo && radar.jobInfo.criado_em ? Math.max(0, Math.round((Date.now() - Date.parse(radar.jobInfo.criado_em)) / 60000)) : null;
                el.innerHTML = stateBox(s.color, `<span class="status-row"><span class="spinner"></span>${s.title}</span>`,
                    `${s.text}${since !== null ? ` Started ${since === 0 ? 'less than a minute' : plural(since, 'minute')} ago.` : ''} You can go back to the globe; this page keeps checking.`);
                return;
            }
            if (radar.jobState === 'falhou') {
                const err = String(radar.jobErr || '');
                const why = /h5py|No module named/i.test(err)
                    ? 'The radar server is missing a software component it needs to open NISAR files. This is a server setup problem, not a problem with the event data.'
                    : 'The radar server stopped before finishing. This can happen if the server restarted or ran out of memory.';
                el.innerHTML = stateBox('var(--bad)', 'The radar server could not finish this analysis', why,
                    `<details class="tech" style="margin-top:10px"><summary>Technical message</summary><code style="white-space:pre-wrap">${esc(err || 'no message')}</code></details>
                     <div class="btn-row" style="margin-top:12px"><button class="btn" data-r="retry">${icon('play')} Try again</button></div>`);
                return;
            }
            if (!pair) {
                el.innerHTML = stateBox('var(--info)', 'Nothing to compare yet', 'A comparison needs one radar image from before and one from after the event, taken from the same orbit. Step 2 explains what is missing.');
                return;
            }
            const notFlood = ev.cat !== 'floods';
            el.innerHTML = `
                ${radar.jobErr && !radar.jobState ? `<div class="note" style="--nc:var(--warn);margin-bottom:12px">${esc(radar.jobErr)}</div>` : ''}
                ${stateBox('var(--radar)', 'Ready to compare',
                    `The NISAR server will take a small box around the event (about 13 × 10 km), cut it from both passes, align the two images and measure how the radar brightness changed between ${esc(fmtDay(plan.before))} and ${esc(fmtDay(plan.after))}. It takes a few minutes.
                    ${notFlood ? `<br><br>This method was built to spot new open water after floods. For a ${esc(CATS[ev.cat].one)} it still shows where the surface changed, but the "possible new water" layer does not apply.` : ''}`,
                    `<div class="btn-row" style="margin-top:12px"><button class="btn primary" data-r="run">${icon('play')} Run the radar comparison</button></div>`)}`;
        }

        async function refreshJob(first = false) {
            const ev = radar.ev, token = radar.token;
            if (!ev || !ev.recordId) return;
            try {
                const st = await apiFetch(`/api/eventos/${encodeURIComponent(ev.recordId)}/analise`);
                if (token !== radar.token) return;
                radar.jobInfo = { ...st.job, criado_em: st.criado_em || (st.job && st.job.criado_em) };
                radar.jobState = st.estado;
                radar.jobErr = st.erro || null;
            } catch (err) {
                if (token !== radar.token) return;
                if (err.status === 404) { radar.jobState = null; radar.jobErr = null; }
                else if (!first) return;   // temporary error while polling: keep the last state
                else radar.jobErr = `Could not read the analysis status (${err.message}).`;
            }
            const busy = radar.jobState === 'na_fila' || radar.jobState === 'processando';
            if (busy && !radar.poll) radar.poll = setInterval(() => refreshJob(), 6000);
            if (!busy && radar.poll) { clearInterval(radar.poll); radar.poll = null; }
            if (radar.jobState === 'concluida' && !radar.result) await loadResults();
            renderStep3();
            renderStep4();
        }

        async function startAnalysis(redo) {
            const ev = radar.ev;
            if (!ev || !ev.recordId) return;
            const el = document.getElementById('step3');
            el.innerHTML = `<div class="status-row muted"><div class="spinner"></div>Sending the request to the NISAR server...</div>`;
            try {
                const r = await apiFetch(`/api/eventos/${encodeURIComponent(ev.recordId)}/analise`, { method: 'POST', body: redo ? { refazer: true } : {} , timeout: 60000 });
                radar.jobInfo = r;
                radar.jobState = r.estado || 'na_fila';
                radar.jobErr = null;
                radar.result = null;
            } catch (err) {
                radar.jobState = null;
                radar.jobErr = err.status === 409 ? 'NISAR no longer has a matching before/after pair for this event.'
                    : err.status === 422 ? radarErrorText(err) : `The request did not go through (${err.message}).`;
            }
            await refreshJob(true);
        }

        // ---------- results: metrics + GeoTIFFs rendered in the browser ----------
        let geotiffLib = null;
        function loadGeoTiffLib() {
            if (window.GeoTIFF) return Promise.resolve(window.GeoTIFF);
            if (geotiffLib) return geotiffLib;
            geotiffLib = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = GEOTIFF_LIB;
                s.onload = () => resolve(window.GeoTIFF);
                s.onerror = () => { geotiffLib = null; reject(new Error('could not load the GeoTIFF reader')); };
                document.head.appendChild(s);
            });
            return geotiffLib;
        }

        // UTM (WGS84) -> lon/lat, Snyder's inverse formulas. Good to well under 1 m for an analysis box.
        function utmToLonLat(E, N, zone, south) {
            const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
            const e2 = f * (2 - f), ep2 = e2 / (1 - e2);
            const x = E - 500000, y = south ? N - 10000000 : N;
            const mu = (y / k0) / (a * (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 ** 3 / 256));
            const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
            const phi1 = mu + (3 * e1 / 2 - 27 * e1 ** 3 / 32) * Math.sin(2 * mu) + (21 * e1 ** 2 / 16 - 55 * e1 ** 4 / 32) * Math.sin(4 * mu)
                + (151 * e1 ** 3 / 96) * Math.sin(6 * mu) + (1097 * e1 ** 4 / 512) * Math.sin(8 * mu);
            const s1 = Math.sin(phi1), c1 = Math.cos(phi1), t1 = Math.tan(phi1);
            const C1 = ep2 * c1 * c1, T1 = t1 * t1, N1 = a / Math.sqrt(1 - e2 * s1 * s1);
            const R1 = a * (1 - e2) / (1 - e2 * s1 * s1) ** 1.5, D = x / (N1 * k0);
            const lat = phi1 - (N1 * t1 / R1) * (D * D / 2 - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * D ** 4 / 24
                + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * D ** 6 / 720);
            const lon0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
            const lon = lon0 + (D - (1 + 2 * T1 + C1) * D ** 3 / 6 + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * D ** 5 / 120) / c1;
            return [lon * 180 / Math.PI, lat * 180 / Math.PI];
        }
        function toLonLat(x, y, epsg) {
            if (epsg === 4326 || epsg === 4269 || (!epsg && Math.abs(x) <= 180 && Math.abs(y) <= 90)) return [x, y];
            if (epsg >= 32601 && epsg <= 32660) return utmToLonLat(x, y, epsg - 32600, false);
            if (epsg >= 32701 && epsg <= 32760) return utmToLonLat(x, y, epsg - 32700, true);
            if (epsg === 3857) return [x / 6378137 * 180 / Math.PI, (2 * Math.atan(Math.exp(y / 6378137)) - Math.PI / 2) * 180 / Math.PI];
            return null;
        }

        async function readRaster(name) {
            const res = await fetch(apiFileUrl(radar.ev.recordId, name), { headers: { chave: API_KEY } });
            if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
            const buf = await res.arrayBuffer();
            const GT = await loadGeoTiffLib();
            const tiff = await GT.fromArrayBuffer(buf);
            const img = await tiff.getImage();
            const rasters = await img.readRasters();
            const keys = img.getGeoKeys() || {};
            const epsg = keys.ProjectedCSTypeGeoKey || keys.GeographicTypeGeoKey || null;
            const [x0, y0, x1, y1] = img.getBoundingBox();
            const corners = [[x0, y1], [x1, y1], [x1, y0], [x0, y0]].map(([x, y]) => toLonLat(x, y, epsg));
            return { w: img.getWidth(), h: img.getHeight(), data: rasters[0], nodata: img.getGDALNoData(), epsg, corners: corners.every(Boolean) ? corners : null };
        }

        // Pixel painters
        const valid = (v, nd) => Number.isFinite(v) && (nd === null || v !== nd);
        function paint(r, fn) {
            const c = document.createElement('canvas');
            c.width = r.w; c.height = r.h;
            const ctx = c.getContext('2d');
            const img = ctx.createImageData(r.w, r.h);
            for (let i = 0; i < r.data.length; i++) {
                const v = r.data[i];
                if (!valid(v, r.nodata)) continue;
                const [R, G, B, A] = fn(v);
                img.data[i * 4] = R; img.data[i * 4 + 1] = G; img.data[i * 4 + 2] = B; img.data[i * 4 + 3] = A;
            }
            ctx.putImageData(img, 0, 0);
            return c;
        }
        const grayDb = v => { const g = Math.round(Math.min(1, Math.max(0, (v + 25) / 25)) * 255); return [g, g, g, 255]; };
        // Diverging: blue (darker after) <- gray -> red (brighter after); small changes fade out over the map
        const MID = [138, 138, 133], NEG = [28, 92, 171], POS = [227, 73, 72];
        function changeColor(v) {
            const t = Math.min(1, Math.abs(v) / 8), to = v < 0 ? NEG : POS;
            const alpha = Math.round(Math.min(1, Math.max(0, (Math.abs(v) - 0.5) / 3)) * 235);
            return [0, 1, 2].map(i => Math.round(MID[i] + (to[i] - MID[i]) * t)).concat(alpha);
        }
        const waterColor = v => v >= 0.5 ? [56, 189, 248, 235] : [0, 0, 0, 0];

        const LAYERS = {
            change: { label: 'Change', file: 'mudanca_db.tif', painter: changeColor },
            water: { label: 'Possible new water', file: 'possivel_nova_agua.tif', painter: waterColor },
            before: { label: 'Before', file: 'antes_db.tif', painter: grayDb },
            after: { label: 'After', file: 'depois_db.tif', painter: grayDb }
        };

        async function loadResults() {
            const ev = radar.ev, token = radar.token;
            try {
                radar.result = await apiFetch(`/api/eventos/${encodeURIComponent(ev.recordId)}/analise/resultado`, { timeout: 45000 });
            } catch (err) {
                radar.rasterErr = `Could not read the result (${err.message}).`;
                return;
            }
            if (token !== radar.token) return;
            const files = radar.result.arquivos || {};
            const rasters = {};
            let firstErr = null;
            await Promise.all(Object.entries(LAYERS).map(async ([id, L]) => {
                if (!files[L.file]) return;
                try {
                    const r = await readRaster(L.file);
                    rasters[id] = { ...r, url: paint(r, L.painter).toDataURL('image/png'), canvas: id === 'before' || id === 'after' ? paint(r, grayDb) : null };
                } catch (err) { firstErr = firstErr || err.message; }
            }));
            if (token !== radar.token) return;
            radar.rasters = rasters;
            if (!Object.keys(rasters).length) radar.rasterErr = `The radar images could not be read${firstErr ? ` (${firstErr})` : ''}.`;
            if (!rasters[radar.layer]) radar.layer = Object.keys(LAYERS).find(k => rasters[k]) || 'change';
        }

        function metricHeadline(ev, m, plan) {
            const area = Number(m.area_analisada_km2), nw = Number(m.area_candidata_nova_agua_km2), med = Number(m.variacao_mediana_hh_db);
            const span = `between ${fmtDay(plan.before)} and ${fmtDay(plan.after)}`;
            if (ev.cat === 'floods' && Number.isFinite(nw)) {
                if (nw > 0) {
                    const pct = area > 0 ? ` That is ${fmtNum(nw / area * 100)}% of the ${fmtNum(area)} km² analysed around the event.` : '';
                    return [`${fmtNum(nw, 2)} km² started to reflect the radar like open water ${span}.`, `${pct} Calm water is smooth, so it sends the radar pulse away from the satellite and looks dark.`];
                }
                return [`The radar found no new water-like areas ${span} in the analysed box.`, 'The flood may have been outside the 13 × 10 km box, under vegetation, or already gone by the second pass.'];
            }
            if (Number.isFinite(med)) {
                return [`The radar signal changed by a median of ${med > 0 ? '+' : ''}${fmtNum(med, 2)} dB ${span}.`, 'Negative values mean the surface became darker (smoother), positive values mean it became brighter (rougher).'];
            }
            return ['The analysis finished.', ''];
        }

        function renderResults() {
            const el = document.getElementById('step3');
            const ev = radar.ev, plan = radar.plan, res = radar.result;
            if (!res && !radar.rasterErr) { el.innerHTML = `<div class="status-row muted"><div class="spinner"></div>Reading the radar images...</div>`; return; }
            const m = (res && res.metricas) || {};
            const [big, small] = metricHeadline(ev, m, plan);
            const R = radar.rasters || {};
            const thumb = (id, label, day) => `<div class="thumb" id="thumb-${id}">${R[id] ? '' : `<span>${label} image not available</span>`}<span class="thumb-label">${label} · ${esc(fmtDay(day, true))}</span></div>`;
            const metric = (label, value, unit, help) => `<div class="metric"><div class="m-label">${label}</div><div class="m-value">${value}${value !== '-' && unit ? ` <span style="font-size:14px;color:var(--text-3)">${unit}</span>` : ''}</div>${help ? `<div class="m-help">${help}</div>` : ''}</div>`;
            el.innerHTML = `
                <div class="headline"><div class="big">${esc(big)}</div>${small ? `<div class="small">${esc(small)}</div>` : ''}</div>
                ${radar.rasterErr ? `<div class="note" style="--nc:var(--warn);margin-top:12px">${esc(radar.rasterErr)}</div>` : ''}
                <div class="pair-grid" style="margin-top:14px">${thumb('before', 'Before', plan.before)}${thumb('after', 'After', plan.after)}</div>
                <div class="muted" style="margin-top:6px">Radar brightness on each date. Dark = smooth surface (calm water, flat ground). Bright = rough surface (trees, buildings, slopes).</div>
                ${Object.keys(R).length ? `
                <div class="toolbar" style="margin-top:16px">
                    <div class="toggle-group" role="group" aria-label="Map layer">
                        ${Object.entries(LAYERS).filter(([id]) => R[id]).map(([id, L]) => `<button data-r="layer" data-layer="${id}" aria-pressed="${radar.layer === id}">${L.label}</button>`).join('')}
                    </div>
                    <label class="slider">Transparency <input type="range" id="radar-opacity" min="0" max="100" value="${Math.round((1 - radar.opacity) * 100)}"></label>
                </div>
                <div id="radar-map" style="margin-top:10px"></div>
                <div id="radar-legend" style="margin-top:10px"></div>
                ${R.change && !R.change.corners ? '<div class="muted">The image projection is not supported for the map overlay; the pictures above still show the result.</div>' : ''}` : ''}
                <div class="metric-grid" style="margin-top:16px">
                    ${metric('Area analysed', fmtNum(m.area_analisada_km2, 2), 'km²')}
                    ${metric('Water-like area before', fmtNum(m.area_agua_escura_antes_km2, 2), 'km²', 'Very dark radar return')}
                    ${metric('Water-like area after', fmtNum(m.area_agua_escura_depois_km2, 2), 'km²', 'Very dark radar return')}
                    ${metric('Possible new water', fmtNum(m.area_candidata_nova_agua_km2, 2), 'km²', 'Dark after, not before, and got darker')}
                    ${metric('Typical change', Number.isFinite(Number(m.variacao_mediana_hh_db)) ? `${Number(m.variacao_mediana_hh_db) > 0 ? '+' : ''}${fmtNum(m.variacao_mediana_hh_db, 2)}` : '-', 'dB', `Most pixels between ${fmtNum(m.variacao_p10_hh_db, 1)} and ${fmtNum(m.variacao_p90_hh_db, 1)} dB`)}
                </div>`;
            ['before', 'after'].forEach(id => { if (R[id] && R[id].canvas) document.getElementById(`thumb-${id}`).prepend(R[id].canvas); });
            const op = document.getElementById('radar-opacity');
            if (op) op.addEventListener('input', () => {
                radar.opacity = 1 - op.value / 100;
                if (radar.map && radar.map.getLayer('radar-img')) radar.map.setPaintProperty('radar-img', 'raster-opacity', radar.opacity);
            });
            buildRadarMap();
            renderLayer();
        }

        function buildRadarMap() {
            const R = radar.rasters || {};
            const first = R[radar.layer];
            if (!first || !first.corners || !document.getElementById('radar-map')) return;
            if (radar.map) { radar.map.remove(); radar.map = null; }
            const lons = first.corners.map(c => c[0]), lats = first.corners.map(c => c[1]);
            radar.map = new maplibregl.Map({
                container: 'radar-map',
                style: {
                    version: 8,
                    sources: { sat: { type: 'raster', tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'], tileSize: 256 } },
                    layers: [{ id: 'sat', type: 'raster', source: 'sat' }]
                },
                bounds: [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
                fitBoundsOptions: { padding: 24 },
                attributionControl: false
            });
            radar.map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
            radar.map.on('load', () => {
                radar.map.addSource('radar-img', { type: 'image', url: first.url, coordinates: first.corners });
                radar.map.addLayer({ id: 'radar-img', type: 'raster', source: 'radar-img', paint: { 'raster-opacity': radar.opacity, 'raster-fade-duration': 0 } });
                const ev = radar.ev;
                radar.map.addSource('ev-point', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: [ev.lon, ev.lat] }, properties: {} } });
                radar.map.addLayer({ id: 'ev-point', type: 'circle', source: 'ev-point', paint: { 'circle-radius': 6, 'circle-color': CATS[ev.cat].color, 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
                renderLayer();
            });
        }

        function renderLayer() {
            const R = radar.rasters || {};
            const r = R[radar.layer];
            document.querySelectorAll('[data-r="layer"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.layer === radar.layer)));
            if (r && r.corners && radar.map && radar.map.getSource('radar-img')) radar.map.getSource('radar-img').updateImage({ url: r.url, coordinates: r.corners });
            const lg = document.getElementById('radar-legend');
            if (!lg) return;
            const ramp = (grad, l, m, rgt, title) => `<div class="ramp"><div style="color:var(--text-2);font-weight:600">${title}</div><div class="ramp-bar" style="background:${grad}"></div><div class="ramp-labels"><span>${l}</span><span>${m}</span><span>${rgt}</span></div></div>`;
            lg.innerHTML = {
                change: `<div class="legend-row">${ramp('linear-gradient(90deg,#1c5cab,#5b86bb,#8a8a85,#c4605d,#e34948)', 'Became darker (-8 dB)', 'No change', 'Became brighter (+8 dB)', 'Change in radar brightness, after minus before')}</div>
                    <div class="muted" style="margin-top:6px">Small changes (under about 1 dB) are see-through so you can see the ground underneath.</div>`,
                water: `<div class="legend-row"><span class="legend-item"><span class="swatch" style="--c:#38bdf8"></span>Possible new open water: dark after the event, not before, and at least 2 dB darker</span></div>`,
                before: ramp('linear-gradient(90deg,#000,#fff)', 'Dark (-25 dB): smooth', '', 'Bright (0 dB): rough', `Radar brightness on ${fmtDay(radar.plan.before)}`),
                after: ramp('linear-gradient(90deg,#000,#fff)', 'Dark (-25 dB): smooth', '', 'Bright (0 dB): rough', `Radar brightness on ${fmtDay(radar.plan.after)}`)
            }[radar.layer] || '';
        }

        // ---------- step 4: explanation + technical data ----------
        const EXPLAIN = {
            floods: ['Calm water is smooth like a mirror: it bounces the radar pulse away from the satellite, so it appears dark. An area that turns dark after a flood has probably filled with water.',
                'Flooded forests and towns can look brighter, not darker, so water under trees or between buildings may be missed. Smooth bare soil and radar shadow behind hills can also look like water.'],
            wildfires: ['A living forest canopy scatters a lot of radar energy back to the satellite. After a fire burns the leaves and branches, the area usually turns darker.',
                'Rain, soil moisture and harvests also change the signal. The "possible new water" layer was designed for floods and should not be read here.'],
            earthquakes: ['Landslides, collapsed buildings and cracked ground change how rough the surface is, and rough surfaces look brighter to radar.',
                'This comparison measures brightness, not ground movement. Measuring how many centimetres the ground moved needs radar interferometry (InSAR), which this server does not run yet.'],
            volcanoes: ['Fresh lava, ash and mudflows change the roughness of the surface, so they show up as brighter or darker patches.',
                'Ash on vegetation and wet or dry weather between the two passes can produce similar changes.'],
            storms: ['Strong winds knock down trees and roofs, and heavy rain floods low areas. Both change the radar brightness.',
                'Wet ground after rain also changes the signal even where nothing was damaged.'],
            ice: ['Open water looks dark and ice looks brighter, so radar can track ice forming or breaking up.',
                'Wind roughens open water and melting changes the ice surface, which can be confused with ice changes.'],
            other: ['The radar measures how rough and wet the surface is. A change between the two passes means something on the ground changed.',
                'Weather and season also change the signal, so a change is a clue, not proof of damage.']
        };

        function renderStep4() {
            const el = document.getElementById('step4');
            if (!el || !radar.ev) return;
            const ev = radar.ev, res = radar.result, plan = radar.plan, info = radar.jobInfo;
            const [shows, hypo] = EXPLAIN[ev.cat] || EXPLAIN.other;
            const done = radar.jobState === 'concluida' && res;
            const files = (res && res.arquivos) || {};
            const m = (res && res.metricas) || {};
            el.innerHTML = `
                <div class="explain-grid">
                    <div class="explain"><h4>${icon('eye')} What the radar shows</h4><p>${esc(shows)}</p></div>
                    <div class="explain"><h4>${icon('help')} What is still a hypothesis</h4><p>${esc(hypo)}</p></div>
                </div>
                <div class="muted">The event itself is confirmed by ${ev.source === 'usgs' ? 'USGS' : 'NASA EONET'}${ev.inApi ? ' and the Disaster API' : ''}. The radar adds evidence about what changed on the ground; it does not replace a field survey.</div>
                <div class="btn-row">
                    <button class="btn" data-r="tech" ${done || plan ? '' : 'disabled'}>${icon('layers')} View technical data</button>
                    ${done && files['resultados.zip'] ? `<a class="btn" href="${esc(apiFileUrl(ev.recordId, 'resultados.zip'))}" download>${icon('download')} Download results</a>` : `<button class="btn" disabled title="Available after the analysis">${icon('download')} Download results</button>`}
                    ${done && files['comparacao.png'] ? `<a class="btn" href="${esc(apiFileUrl(ev.recordId, 'comparacao.png'))}" target="_blank" rel="noopener">${icon('external')} Comparison figure</a>` : ''}
                </div>
                <details class="tech" id="tech-details">
                    <summary>Technical data</summary>
                    <table class="kv">
                        <tr><td>Event record</td><td>${esc(ev.recordId || '-')}</td></tr>
                        <tr><td>Source position (lat, lon)</td><td>${esc(ev.apiLat ?? ev.lat)}, ${esc(ev.apiLon ?? ev.lon)}</td></tr>
                        ${info ? `<tr><td>Analysis job</td><td>${esc(info.job_id || '-')} (${esc(radar.jobState || '-')})</td></tr>
