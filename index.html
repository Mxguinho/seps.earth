<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Mapa Interativo - Destaque de Países</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.css"
    />

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #000;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        .maplibregl-canvas {
            cursor: grab;
        }

        .maplibregl-canvas:active {
            cursor: grabbing;
            z-index: 200;
        }
    </style>
</head>

<body>
   
    <div style="background-color: rgba(8, 37, 134, 0.322); display: none; width: 300px; height: 100%; position: fixed; right: 0px; z-index: 10;">
        <div>asd</div>
    </div>

    <div id="map"></div>

<script type="module">

import * as maplibregl from
'https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.mjs';


// ==========================================
// CONFIGURAÇÃO DO MAPA
// ==========================================

const map = new maplibregl.Map({
    container: 'map',
    zoom: 2.2,
    center: [-46.6333, -15.0],
    pitch: 0,
    maxPitch: 85
});


// ==========================================
// CONFIGURAÇÃO DO ESTILO
// ==========================================

map.setStyle(
    'https://tiles.openfreemap.org/styles/bright',
    {
        transformStyle: (previousStyle, nextStyle) => {

            nextStyle.projection = {
                type: 'globe'
            };

            nextStyle.sources = {
                ...nextStyle.sources,

                satelliteSource: {
                    type: 'raster',
                    tiles: [
                        'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'
                    ],
                    tileSize: 256
                },

                terrainSource: {
                    type: 'raster-dem',
                    url: 'https://tiles.mapterhorn.com/tilejson.json'
                },

                hillshadeSource: {
                    type: 'raster-dem',
                    url: 'https://tiles.mapterhorn.com/tilejson.json'
                }
            };

            nextStyle.terrain = {
                source: 'terrainSource',
                exaggeration: 1
            };

            nextStyle.sky = {
                'atmosphere-blend': [
                    'interpolate',
                    ['linear'],
                    ['zoom'],
                    0, 1,
                    2, 0
                ]
            };

            nextStyle.layers.push({
                id: 'hills',
                type: 'hillshade',
                source: 'hillshadeSource',
                layout: {
                    visibility: 'visible'
                },
                paint: {
                    'hillshade-shadow-color': '#473B24'
                }
            });

            const firstRoadLayer = nextStyle.layers.find(
                layer => layer['source-layer'] === 'transportation'
            );

            nextStyle.layers.splice(
                nextStyle.layers.indexOf(firstRoadLayer),
                0,
                {
                    id: 'satellite',
                    type: 'raster',
                    source: 'satelliteSource',
                    layout: {
                        visibility: 'visible'
                    },
                    paint: {
                        'raster-opacity': 1
                    }
                }
            );

            return nextStyle;
        }
    }
);


// ==========================================
// CONTROLES
// ==========================================

map.addControl(
    new maplibregl.NavigationControl({
        visualizePitch: true,
        showZoom: true,
        showCompass: true
    })
);

map.addControl(
    new maplibregl.GlobeControl()
);

map.addControl(
    new maplibregl.TerrainControl({
        source: 'terrainSource',
        exaggeration: 1
    })
);


// ==========================================
// DESTAQUE INTERATIVO - PAÍSES
// ==========================================

let paisSelecionadoId = null;

map.on('load', async () => {

    try {
        // GeoJSON global com os limites dos países
        const geojsonURL =
            'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson';

        const resposta = await fetch(geojsonURL);

        if (!resposta.ok) {
            throw new Error('Não foi possível carregar o GeoJSON dos países.');
        }

        const paises = await resposta.json();

        // ======================================
        // FONTE GEOJSON
        // ======================================

        map.addSource('paises-source', {
            type: 'geojson',
            data: paises,
            generateId: true // Cria ID único automático para cada país
        });

        // ======================================
        // PREENCHIMENTO DO PAÍS (INVISÍVEL ATÉ O CLIQUE)
        // ======================================

        map.addLayer({
            id: 'paises-fill',
            type: 'fill',
            source: 'paises-source',
            paint: {
                'fill-color': '#00CFFF',
                'fill-opacity': [
                    'case',
                    ['boolean', ['feature-state', 'selected'], false],
                    0.32,
                    0
                ]
            }
        });

        // ======================================
        // CONTORNO DO PAÍS
        // ======================================

        map.addLayer({
            id: 'paises-outline',
            type: 'line',
            source: 'paises-source',
            paint: {
                'line-color': '#00DFFF',
                'line-width': 3,
                'line-blur': 0.5,
                'line-opacity': [
                    'case',
                    ['boolean', ['feature-state', 'selected'], false],
                    1,
                    0
                ]
            }
        });

        // ======================================
        // EFEITO LUMINOSO EXTERNO
        // ======================================

        map.addLayer({
            id: 'paises-glow',
            type: 'line',
            source: 'paises-source',
            paint: {
                'line-color': '#000',
                'line-width': 9,
                'line-blur': 5,
                'line-opacity': [
                    'case',
                    ['boolean', ['feature-state', 'selected'], false],
                    0.8,
                    0
                ]
            }
        });

        // ======================================
        // FUNÇÃO DE SELEÇÃO
        // ======================================

        function selecionarPais(novoId) {
            // Remove o destaque do país anterior, se houver
            if (paisSelecionadoId !== null) {
                map.setFeatureState(
                    { source: 'paises-source', id: paisSelecionadoId },
                    { selected: false }
                );
            }

            paisSelecionadoId = novoId;

            // Aplica o destaque no novo país clicado
            if (paisSelecionadoId !== null) {
                map.setFeatureState(
                    { source: 'paises-source', id: paisSelecionadoId },
                    { selected: true }
                );
            }
        }

        // ======================================
        // EVENTO DE CLIQUE NO MAPA
        // ======================================

        map.on('click', (evento) => {
            const { lng, lat } = evento.lngLat;
            console.log(`Latitude: ${lat} | Longitude: ${lng}`);

            const elementos = map.queryRenderedFeatures(evento.point, {
                layers: ['paises-fill']
            });

            if (elementos.length > 0) {
                const paisClicado = elementos[0];
                console.log('País selecionado:', paisClicado.properties.ADMIN || paisClicado.properties.name);
                selecionarPais(paisClicado.id);
            } else {
                // Clicou no oceano / fora de qualquer país: limpa o destaque
                selecionarPais(null);
            }
        });

        // ======================================
        // CURSOR INTERATIVO
        // ======================================

        map.on('mouseenter', 'paises-fill', () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', 'paises-fill', () => {
            map.getCanvas().style.cursor = '';
        });

        console.log('Mapa interativo de países carregado!');

    } catch (erro) {
        console.error('Erro ao carregar os limites dos países:', erro);
    }

});


        // ======================================
        // REMOVE CONTROLADORES DA TELA
        // ======================================

document.querySelector('.maplibregl-ctrl-top-right').style.display = 'none';
document.querySelector('.maplibregl-control-container').style.display = 'none';

</script>

</body>
</html>
