
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Mapa Interativo - Estado de São Paulo</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.css"
    />

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #000;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        .maplibregl-canvas {
            cursor: grab;
        }

        .maplibregl-canvas:active {
            cursor: grabbing;
            z-index: 200;
        }
    </style>
</head>

<body>


    <div style="background-color: rgba(8, 37, 134, 0.322); width: 300px; height: 100%;  position: fixed; right: 0px;">
            <div>asd</div>
    </div>
<div id="map"></div>

<script type="module">

import * as maplibregl from
'https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.mjs';


// ==========================================
// CONFIGURAÇÃO DO MAPA
// ==========================================

const map = new maplibregl.Map({

    container: 'map',

    zoom: 5.5,

    center: [-46.6333, -23.5505],

    pitch: 0,

    maxPitch: 85

});


// ==========================================
// CONFIGURAÇÃO DO ESTILO
// ==========================================

map.setStyle(
    'https://tiles.openfreemap.org/styles/bright',
    {
        transformStyle: (previousStyle, nextStyle) => {

            nextStyle.projection = {
                type: 'globe'
            };

            nextStyle.sources = {

                ...nextStyle.sources,

                satelliteSource: {
                    type: 'raster',

                    tiles: [
                        'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'
                    ],

                    tileSize: 256
                },

                terrainSource: {
                    type: 'raster-dem',
                    url: 'https://tiles.mapterhorn.com/tilejson.json'
                },

                hillshadeSource: {
                    type: 'raster-dem',
                    url: 'https://tiles.mapterhorn.com/tilejson.json'
                }

            };


            nextStyle.terrain = {
                source: 'terrainSource',
                exaggeration: 1
            };


            nextStyle.sky = {

                'atmosphere-blend': [
                    'interpolate',
                    ['linear'],
                    ['zoom'],
                    0, 1,
                    2, 0
                ]

            };


            nextStyle.layers.push({

                id: 'hills',

                type: 'hillshade',

                source: 'hillshadeSource',

                layout: {
                    visibility: 'visible'
                },

                paint: {
                    'hillshade-shadow-color': '#473B24'
                }

            });


            const firstRoadLayer = nextStyle.layers.find(
                layer =>
                    layer['source-layer'] === 'transportation'
            );


            nextStyle.layers.splice(
                nextStyle.layers.indexOf(firstRoadLayer),
                0,
                {

                    id: 'satellite',

                    type: 'raster',

                    source: 'satelliteSource',

                    layout: {
                        visibility: 'visible'
                    },

                    paint: {
                        'raster-opacity': 1
                    }

                }
            );


            return nextStyle;

        }
    }
);














// ==========================================
// CONTROLES
// ==========================================

map.addControl(
    new maplibregl.NavigationControl({

        visualizePitch: true,
        showZoom: true,
        showCompass: true

    })
);

map.addControl(
    new maplibregl.GlobeControl()
);

map.addControl(
    new maplibregl.TerrainControl({

        source: 'terrainSource',
        exaggeration: 1

    })
);


// ==========================================
// DESTAQUE INTERATIVO - SÃO PAULO
// ==========================================

let estadoSelecionado = false;

map.on('load', async () => {

    try {

        // GeoJSON dos estados brasileiros
        // Dados com limites geográficos do IBGE

        const geojsonURL =
            'https://cdn.jsdelivr.net/gh/henriquemalvar/br-geojson@main/dist/estados.geojson';


        // Carrega os limites geográficos

        const resposta = await fetch(geojsonURL);

        if (!resposta.ok) {
            throw new Error('Não foi possível carregar o GeoJSON.');
        }

        const estados = await resposta.json();


        // Localiza somente o estado de São Paulo

        const saoPaulo = {

            type: 'FeatureCollection',

            features: estados.features.filter(feature => {

                return (
                    feature.properties.sigla === 'SP'
                );

            })

        };


        if (saoPaulo.features.length === 0) {
            throw new Error('Estado de São Paulo não encontrado.');
        }


        // ======================================
        // FONTE GEOJSON
        // ======================================

        map.addSource('sao-paulo-source', {

            type: 'geojson',

            data: saoPaulo

        });


        // ======================================
        // PREENCHIMENTO DO ESTADO
        // ======================================

        map.addLayer({

            id: 'sp-fill',

            type: 'fill',

            source: 'sao-paulo-source',

            paint: {

                'fill-color': '#00CFFF',

                'fill-opacity': 0

            }

        });


        // ======================================
        // CONTORNO DO ESTADO
        // ======================================

        map.addLayer({

            id: 'sp-outline',

            type: 'line',

            source: 'sao-paulo-source',

            paint: {

                'line-color': '#00DFFF',

                'line-width': 3,

                'line-opacity': 0,

                'line-blur': 0.5

            }

        });


        // ======================================
        // EFEITO LUMINOSO EXTERNO
        // ======================================

        map.addLayer({

            id: 'sp-glow',

            type: 'line',

            source: 'sao-paulo-source',

            paint: {

                'line-color': '#00BFFF',

                'line-width': 9,

                'line-blur': 5,

                'line-opacity': 0

            }

        });


        // ======================================
        // FUNÇÃO DE SELEÇÃO
        // ======================================

        function destacarSaoPaulo(selecionado) {

            estadoSelecionado = selecionado;


            // Preenchimento translúcido

            map.setPaintProperty(
                'sp-fill',
                'fill-opacity',
                selecionado ? 0.32 : 0
            );


            // Contorno luminoso

            map.setPaintProperty(
                'sp-outline',
                'line-opacity',
                selecionado ? 1 : 0
            );


            // Brilho externo

            map.setPaintProperty(
                'sp-glow',
                'line-opacity',
                selecionado ? 0.8 : 0
            );

        }


        // ======================================
        // CLIQUE DENTRO DE SÃO PAULO
        // ======================================

        map.on('click', 'sp-fill', () => {

            destacarSaoPaulo(true);

        });


        // ======================================
        // CLIQUE FORA DO ESTADO
        // ======================================

        map.on('click', (evento) => {

            const elementos = map.queryRenderedFeatures(
                evento.point,
                {
                    layers: ['sp-fill']
                }
            );


            // Se clicou fora do território,
            // remove o destaque.

            if (elementos.length === 0 && estadoSelecionado) {

                destacarSaoPaulo(false);

            }

        });


        // ======================================
        // CURSOR INTERATIVO
        // ======================================

        map.on('mouseenter', 'sp-fill', () => {

            map.getCanvas().style.cursor = 'pointer';

        });


        map.on('mouseleave', 'sp-fill', () => {

            map.getCanvas().style.cursor = '';

        });


        console.log('Mapa de São Paulo carregado!');

    }

    catch (erro) {

        console.error(
            'Erro ao carregar o limite de São Paulo:',
            erro
        );

    }

});

</script>

</body>
</html>
