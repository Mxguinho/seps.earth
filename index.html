<!DOCTYPE html>
<html lang="en">

<head>
    <title>NASA SPACE APPS CHALLENGE | NISAR</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- MapLibre GL CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.css" />

    <style>
        /* ========================================================
           DESIGN TOKENS
           Category colors follow what people expect: fire = orange, flood = blue,
           volcano = red, earthquake = amber, storm = violet, ice = pale blue.
           ======================================================== */
        :root {
            --accent: #00e5ff;
            --accent-soft: rgba(0, 229, 255, 0.14);
            --panel: rgba(8, 12, 22, 0.94);
            --panel-solid: #0b1120;
            --surface: rgba(255, 255, 255, 0.045);
            --surface-2: rgba(255, 255, 255, 0.07);
            --border: rgba(148, 163, 184, 0.2);
            --border-strong: rgba(148, 163, 184, 0.36);
            --text-1: #f1f5f9;
            --text-2: #cbd5e1;
            --text-3: #94a3b8;
            --good: #22c55e;
            --warn: #f59e0b;
            --bad: #ef4444;
            --info: #94a3b8;
            --radar: #3987e5;
            --event: #ef4444;

            --cat-wildfires: #e8692e;
            --cat-floods: #3987e5;
            --cat-earthquakes: #e0a800;
            --cat-volcanoes: #e64646;
            --cat-storms: #9085e9;
            --cat-ice: #a5e3f5;
            --cat-other: #9aa3ad;

            --fs-xs: 12px;
            --fs-sm: 13px;
            --fs-md: 14.5px;
            --fs-lg: 17px;
            --fs-xl: 22px;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
            color: var(--text-1);
            font-size: var(--fs-md);
            line-height: 1.5;
        }

        button,
        input,
        select {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .icon {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* Deep Space Starfield */
        #space-starfield {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background: #000000;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            background: transparent !important;
        }

        .maplibregl-canvas {
            cursor: grab;
            background: transparent !important;
        }

        .maplibregl-canvas:active {
            cursor: grabbing;
        }

        .maplibregl-ctrl-attrib,
        .maplibregl-ctrl-attrib-button,
        .maplibregl-compact,
        .maplibregl-ctrl-bottom-right {
            display: none !important;
        }

        /* ========================================================
           1. HEADER + TABS
           ======================================================== */
        #top-header {
            position: absolute;
            top: 18px;
            left: 24px;
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 10px 8px 16px;
            background: rgba(3, 8, 20, 0.86);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            box-shadow: 0 4px 22px rgba(0, 0, 0, 0.7);
        }

        .nasa-logo-img {
            height: 34px;
            width: 34px;
            border-radius: 50%;
            display: block;
            object-fit: cover;
        }

        .header-divider {
            width: 1px;
            height: 24px;
            background: var(--border-strong);
        }

        .header-title-main {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.1px;
            text-transform: uppercase;
        }

        .header-sub-nisar {
            font-size: 15px;
            font-weight: 600;
            color: #93c5fd;
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            padding: 3px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .tab-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            border: 0;
            background: transparent;
            color: var(--text-2);
            font-size: var(--fs-sm);
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.15s, color 0.15s;
        }

        .tab-btn:hover {
            color: var(--text-1);
            background: var(--surface-2);
        }

        .tab-btn[aria-selected="true"] {
            background: var(--accent);
            color: #021018;
        }

        /* ========================================================
           2. LEFT PANEL: country search, period, status
           ======================================================== */
        #explore-panel {
            position: absolute;
            top: 86px;
            left: 24px;
            z-index: 20;
            width: 340px;
            max-width: calc(100vw - 48px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.6);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: var(--fs-lg);
            font-weight: 700;
        }

        .accent-bar {
            width: 4px;
            height: 20px;
            background: var(--accent);
            border-radius: 3px;
        }

        .field-label {
            font-size: var(--fs-xs);
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .combo {
            position: relative;
        }

        .combo-input-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 9px;
            color: var(--text-3);
        }

        .combo-input-wrap:focus-within {
            border-color: var(--accent);
        }

        .combo input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            padding: 9px 0;
            color: var(--text-1);
        }

        .combo input::placeholder {
            color: var(--text-3);
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--text-3);
        }

        .icon-btn:hover {
            color: var(--text-1);
            background: var(--surface-2);
        }

        .combo-list {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            max-height: 300px;
            overflow-y: auto;
            background: var(--panel-solid);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.7);
            z-index: 50;
            display: none;
            padding: 4px;
        }

        .combo-list.open {
            display: block;
        }

        .combo-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            width: 100%;
            border: 0;
            background: transparent;
            text-align: left;
            padding: 8px 10px;
            border-radius: 7px;
            color: var(--text-1);
        }

        .combo-option:hover,
        .combo-option.active {
            background: var(--accent-soft);
        }

        .combo-option .count {
            font-size: var(--fs-xs);
            color: var(--text-3);
            white-space: nowrap;
        }

        .combo-group {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-3);
            padding: 8px 10px 4px;
        }

        .segmented {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            padding: 3px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 9px;
        }

        .segmented button {
            border: 0;
            background: transparent;
            color: var(--text-2);
            font-size: var(--fs-sm);
            font-weight: 600;
            padding: 6px 0;
            border-radius: 7px;
        }

        .segmented button:hover {
            background: var(--surface-2);
            color: var(--text-1);
        }

        .segmented button[aria-pressed="true"] {
            background: var(--text-1);
            color: #0b1120;
        }

        .status-box {
            font-size: var(--fs-sm);
            color: var(--text-2);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 10px 12px;
            line-height: 1.5;
        }

        .status-box strong {
            color: var(--text-1);
        }

        .status-box.error {
            border-color: rgba(245, 158, 11, 0.5);
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .source-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: var(--fs-xs);
            font-weight: 600;
            color: var(--text-2);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 2px 9px;
            white-space: nowrap;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex: 0 0 auto;
            background: var(--c, var(--accent));
        }

        .spinner {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid rgba(148, 163, 184, 0.3);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            flex: 0 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .link-btn {
            border: 0;
            background: transparent;
            color: var(--accent);
            font-weight: 600;
            padding: 0;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* ========================================================
           3. BOTTOM DOCK: category filters (also the map legend)
           ======================================================== */
        #bottom-disasters-bar {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            max-width: calc(100vw - 32px);
            background: rgba(3, 9, 24, 0.86);
            border: 1px solid var(--border-strong);
            border-radius: 14px;
            backdrop-filter: blur(18px);
            z-index: 25;
            box-shadow: 0 12px 42px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .dock-drag-bar {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }

        .dock-drag-bar:active {
            cursor: grabbing;
        }

        .drag-icon-handle {
            display: flex;
            gap: 4px;
            opacity: 0.6;
        }

        .drag-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-3);
        }

        .dock-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
        }

        .disaster-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 9px 8px 10px;
            border: 0;
            border-bottom: 3px solid transparent;
            background: transparent;
            position: relative;
            text-align: center;
            transition: background 0.15s;
        }

        .disaster-col:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background: var(--border);
        }

        .disaster-col:hover {
            background: var(--surface-2);
        }

        .disaster-col[aria-pressed="true"] {
            background: var(--surface-2);
            border-bottom-color: var(--c);
        }

        .disaster-col.empty {
            opacity: 0.45;
        }

        .disaster-name {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: var(--fs-md);
            font-weight: 700;
            color: var(--text-1);
        }

        .disaster-desc {
            font-size: var(--fs-xs);
            color: var(--text-3);
        }

        /* ========================================================
           4. RIGHT DETAIL CARD (country / event)
           ======================================================== */
        #detail-card {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 400px;
            max-width: calc(100vw - 36px);
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            background: var(--panel);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.85);
            padding: 20px;
            z-index: 30;
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.2s ease-out;
        }

        #detail-card::-webkit-scrollbar,
        #radar-view::-webkit-scrollbar,
        .combo-list::-webkit-scrollbar {
            width: 8px;
        }

        #detail-card::-webkit-scrollbar-thumb,
        #radar-view::-webkit-scrollbar-thumb,
        .combo-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 4px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .card-kicker {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: var(--fs-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-2);
            margin-bottom: 4px;
        }

        .card-title {
            font-size: var(--fs-xl);
            font-weight: 700;
            line-height: 1.2;
        }

        .card-sub {
            color: var(--text-2);
            margin-top: 4px;
        }

        .close-btn {
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-2);
        }

        .close-btn:hover {
            color: var(--text-1);
            border-color: var(--border-strong);
            background: var(--surface-2);
        }

        .facts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .fact {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 11px;
            min-width: 0;
        }

        .fact-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: var(--fs-xs);
            color: var(--text-3);
        }

        .fact-value {
            font-weight: 600;
            margin-top: 2px;
            overflow-wrap: anywhere;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: var(--fs-md);
            font-weight: 700;
        }

        .muted {
            color: var(--text-3);
            font-size: var(--fs-sm);
        }

        .note {
            font-size: var(--fs-sm);
            color: var(--text-2);
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--nc, var(--info));
            border-radius: 9px;
            padding: 10px 12px;
        }

        .check-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .check {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            font-size: var(--fs-sm);
            color: var(--text-2);
        }

        .check .icon {
            margin-top: 2px;
        }

        .check.ok .icon {
            color: var(--good);
        }

        .check.warn .icon {
            color: var(--warn);
        }

        .check.bad .icon {
            color: var(--bad);
        }

        .check.info .icon {
            color: var(--info);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: var(--fs-xs);
            font-weight: 700;
            border-radius: 999px;
            padding: 3px 10px;
            border: 1px solid currentColor;
            white-space: nowrap;
        }

        .badge.good {
            color: var(--good);
            background: rgba(34, 197, 94, 0.1);
        }

        .badge.warn {
            color: var(--warn);
            background: rgba(245, 158, 11, 0.1);
        }

        .badge.bad {
            color: var(--bad);
            background: rgba(239, 68, 68, 0.1);
        }

        .badge.info {
            color: var(--text-2);
            background: var(--surface);
        }

        .bar-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 120px 1fr 40px;
            align-items: center;
            gap: 10px;
            font-size: var(--fs-sm);
        }

        .bar-label {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text-2);
        }

        .bar-track {
            height: 8px;
            background: var(--surface-2);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--c);
            border-radius: 4px;
        }

        .bar-value {
            text-align: right;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .event-link {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            width: 100%;
            text-align: left;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 8px 10px;
            color: var(--text-1);
            font-size: var(--fs-sm);
        }

        .event-link:hover {
            background: var(--surface-2);
            border-color: var(--border-strong);
        }

        .event-link .dot {
            margin-top: 5px;
        }

        .event-link small {
            display: block;
            color: var(--text-3);
            font-size: var(--fs-xs);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 700;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-1);
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn:hover {
            background: var(--surface-2);
            border-color: var(--text-3);
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #021018;
        }

        .btn.primary:hover {
            filter: brightness(1.08);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .src-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: var(--fs-sm);
        }

        .src-links a {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #7dd3fc;
            text-decoration: none;
        }

        .src-links a:hover {
            text-decoration: underline;
        }

        .tip-box {
            font-size: var(--fs-sm);
            color: var(--text-2);
            background: rgba(245, 158, 11, 0.07);
            border: 1px solid rgba(245, 158, 11, 0.35);
            border-left: 3px solid var(--warn);
            border-radius: 9px;
            padding: 10px 12px;
        }

        /* Map hover popup */
        .maplibregl-popup.hazard-popup .maplibregl-popup-content {
            background: var(--panel-solid);
            border: 1px solid var(--border-strong);
            border-radius: 9px;
            color: var(--text-2);
            font-size: var(--fs-sm);
            padding: 8px 11px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .maplibregl-popup.hazard-popup .maplibregl-popup-tip {
            border-top-color: var(--border-strong);
            border-bottom-color: var(--border-strong);
        }

        .hazard-popup strong {
            color: var(--text-1);
        }

        /* Onboarding hint on the globe */
        #globe-hint {
            position: absolute;
            left: 50%;
            bottom: 128px;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 8px 16px;
            font-size: var(--fs-sm);
            color: var(--text-2);
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* 3D NISAR Satellite */
        .nisar-marker-container {
            position: relative;
            width: 68px;
            height: 68px;
            cursor: pointer;
            transition: transform 0.2s;
            overflow: visible;
        }

        .nisar-marker-container:hover {
            transform: scale(1.25);
        }

        .nisar-canvas-3d {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.7));
        }

        .nisar-orbit-tag {
            position: absolute;
            bottom: -16px;
            left: 50%;
            background: rgba(4, 9, 22, 0.92);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            white-space: nowrap;
            letter-spacing: 0.5px;
            pointer-events: none;
            opacity: 0;
            transform: translateX(-50%) translateY(3px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .nisar-marker-container:hover .nisar-orbit-tag {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========================================================
           5. RADAR COMPARISON TAB
           ======================================================== */
        #radar-view {
            position: fixed;
            inset: 0;
            z-index: 35;
            overflow-y: auto;
            background: #04070e;
            display: none;
            padding: 92px 24px 60px;
        }

        #radar-view.open {
            display: block;
        }

        .radar-wrap {
            max-width: 1040px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .radar-top {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .radar-top h1 {
            font-size: 26px;
            line-height: 1.2;
        }

        .radar-top p {
            color: var(--text-2);
            max-width: 680px;
            margin-top: 6px;
        }

        .step {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .step-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .step-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: var(--fs-lg);
            font-weight: 700;
        }

        .step-num {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(57, 135, 229, 0.18);
            color: #93c5fd;
            font-weight: 700;
            font-size: var(--fs-md);
        }

        .step .lead {
            color: var(--text-2);
            max-width: 820px;
        }

        .facts-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .facts-4 .fact-value {
            font-size: var(--fs-lg);
        }

        .timeline-svg {
            width: 100%;
            height: auto;
            display: block;
            overflow: visible;
        }

        .timeline-svg text {
            font-family: inherit;
        }

        .legend-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: var(--fs-sm);
            color: var(--text-2);
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: var(--c);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .swatch.ring {
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--c);
        }

        .swatch.disc {
            border-radius: 50%;
        }

        .pair-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .thumb {
            position: relative;
            background: #05070d;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-3);
            font-size: var(--fs-sm);
            text-align: center;
            padding: 0;
        }

        .thumb canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: auto;
            display: block;
        }

        .thumb-label {
            position: absolute;
            left: 10px;
            top: 10px;
            background: rgba(4, 7, 14, 0.85);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 3px 9px;
            font-size: var(--fs-xs);
            font-weight: 700;
            color: var(--text-1);
        }

        #radar-map {
            width: 100%;
            height: 420px;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            background: #05070d;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .toggle-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .toggle-group button {
            border: 1px solid var(--border-strong);
            background: transparent;
            color: var(--text-2);
            font-weight: 600;
            font-size: var(--fs-sm);
            padding: 7px 14px;
            border-radius: 9px;
        }

        .toggle-group button:hover {
            color: var(--text-1);
            background: var(--surface-2);
        }

        .toggle-group button[aria-pressed="true"] {
            background: rgba(57, 135, 229, 0.22);
            border-color: var(--radar);
            color: #dbeafe;
        }

        .slider {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: var(--fs-sm);
            color: var(--text-2);
        }

        .slider input {
            width: 180px;
            accent-color: var(--radar);
        }

        .ramp {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: var(--fs-xs);
            color: var(--text-3);
            width: 100%;
            max-width: 560px;
        }

        .ramp-bar {
            height: 10px;
            border-radius: 5px;
            border: 1px solid var(--border);
        }

        .ramp-labels {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .ramp-labels span:nth-child(2) {
            text-align: center;
        }

        .ramp-labels span:last-child {
            text-align: right;
        }

        .headline {
            background: rgba(57, 135, 229, 0.12);
            border: 1px solid rgba(57, 135, 229, 0.45);
            border-radius: 12px;
            padding: 14px 18px;
        }

        .headline .big {
            font-size: 20px;
            font-weight: 700;
            color: #dbeafe;
            line-height: 1.35;
        }

        .headline .small {
            color: var(--text-2);
            font-size: var(--fs-sm);
            margin-top: 4px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .metric {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
        }

        .metric .m-label {
            font-size: var(--fs-xs);
            color: var(--text-3);
        }

        .metric .m-value {
            font-size: 22px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
        }

        .metric .m-help {
            font-size: var(--fs-xs);
            color: var(--text-3);
            margin-top: 2px;
        }

        .explain-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .explain {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .explain h4 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: var(--fs-md);
            margin-bottom: 6px;
        }

        .explain p {
            color: var(--text-2);
        }

        .state-box {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--sc, var(--info));
            border-radius: 12px;
            padding: 14px 16px;
        }

        .state-box h4 {
            font-size: var(--fs-md);
            margin-bottom: 4px;
        }

        .state-box p {
            color: var(--text-2);
            font-size: var(--fs-sm);
        }

        details.tech {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: var(--fs-sm);
            color: var(--text-2);
        }

        details.tech summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--text-1);
        }

        details.tech[open] summary {
            margin-bottom: 8px;
        }

        .kv {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--fs-sm);
        }

        .kv td {
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .kv td:first-child {
            color: var(--text-3);
            width: 42%;
            padding-right: 12px;
        }

        .kv td:last-child {
            font-family: 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
            font-size: 12.5px;
            overflow-wrap: anywhere;
            color: var(--text-1);
        }

        .picker {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .picker-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .picker-controls .combo-input-wrap {
            flex: 1;
            min-width: 240px;
        }

        .picker-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 8px;
        }

        .pick {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-1);
        }

        .pick:hover {
            border-color: var(--border-strong);
            background: var(--surface-2);
        }

        .pick-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .pick-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: var(--fs-xs);
            color: var(--text-3);
        }

        select.select {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 9px;
            padding: 8px 10px;
            color: var(--text-1);
        }

        select.select option {
            background: var(--panel-solid);
        }

        @media (max-width: 900px) {
            #top-header {
                left: 12px;
                right: 12px;
                top: 10px;
                gap: 10px;
                flex-wrap: wrap;
            }

            .header-title-main {
                font-size: 12px;
            }

            #explore-panel {
                top: auto;
                bottom: 110px;
                left: 12px;
                width: calc(100vw - 24px);
                padding: 12px;
            }

            #detail-card {
                width: calc(100vw - 24px);
                right: 12px;
                top: 80px;
                max-height: calc(100vh - 220px);
            }

            .disaster-desc {
                display: none;
            }

            .disaster-name {
                font-size: 12px;
            }

            .facts-4 {
                grid-template-columns: 1fr 1fr;
            }

            .pair-grid,
            .explain-grid {
                grid-template-columns: 1fr;
            }

            #radar-view {
                padding: 120px 12px 40px;
            }
        }
    </style>
</head>

<body>

    <canvas id="space-starfield"></canvas>
    <div id="map"></div>

    <!-- 1. HEADER + TABS -->

    <!-- 2. LEFT PANEL -->

        <div>
            <div class="field-label" id="country-label">Country</div>

                        role="combobox" aria-expanded="false" aria-controls="country-list" aria-labelledby="country-label">

                <button data-period="12m" aria-pressed="false">1 year</button>

        <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Click a country to see its disasters. Highlighted countries have records in the Disaster API.

    <!-- 3. RIGHT DETAIL CARD (built by JS) -->

    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.mjs';
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

        // ========================================================
        // 1. DEEP SPACE STARFIELD
        // ========================================================
        const starCanvas = document.getElementById('space-starfield');
        const starCtx = starCanvas.getContext('2d');
        let stars = [];

        function resizeStarCanvas() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            stars = [];
            const count = Math.floor((starCanvas.width * starCanvas.height) / 3800);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * starCanvas.width,
                    y: Math.random() * starCanvas.height,
                    radius: Math.random() * 0.9 + 0.25,
                    baseAlpha: Math.random() * 0.55 + 0.2,
                    speed: Math.random() * 0.02 + 0.005,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function drawStars() {
            if (document.getElementById('radar-view').classList.contains('open')) { requestAnimationFrame(drawStars); return; }
            starCtx.fillStyle = '#000000';
            starCtx.fillRect(0, 0, starCanvas.width, starCanvas.height);
            stars.forEach(s => {
                s.phase += s.speed;
                const alpha = s.baseAlpha + Math.sin(s.phase) * 0.25;
                starCtx.beginPath();
                starCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                starCtx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, alpha))})`;
                starCtx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resizeStarCanvas);
        resizeStarCanvas();
        drawStars();

        // ========================================================
        // 2. CONFIGURATION
        // ========================================================
        const API_BASE = 'https://sepsapi.earth';         // Disaster API (FastAPI): the reference database
        const API_KEY = 'desastres_naturais';             // header "chave"
        const EONET_BASE = 'https://eonet.gsfc.nasa.gov/api/v3';                   // NASA EONET, live, worldwide
        const USGS_QUERY = 'https://earthquake.usgs.gov/fdsnws/event/1/query';    // USGS earthquakes, live, worldwide
        const USGS_MIN_MAG = 4.5;
        const GEOTIFF_LIB = 'https://cdn.jsdelivr.net/npm/geotiff@3.0.5/dist-browser/geotiff.js';
        const NEARBY_KM = 300;   // click on the ocean: events within this radius

        // Type of disaster. Order = order in the bottom dock.
        const CATS = {
            wildfires: { name: 'Wildfires', one: 'wildfire', color: '#e8692e', desc: 'Active fires',
                tips: 'Follow evacuation orders early. Keep windows closed and use an N95 mask if there is smoke.' },
            floods: { name: 'Floods', one: 'flood', color: '#3987e5', desc: 'Inundated areas',
                tips: 'Move to higher ground. Never walk or drive through moving water, even if it looks shallow.' },
            earthquakes: { name: 'Earthquakes', one: 'earthquake', color: '#e0a800', desc: 'Seismic activity',
                tips: 'Drop, cover and hold on. After the shaking, stay away from damaged buildings and expect aftershocks.' },
            volcanoes: { name: 'Volcanoes', one: 'volcano', color: '#e64646', desc: 'Eruptions and ash',
                tips: 'Stay out of exclusion zones and river valleys. Protect your eyes and lungs from ash.' },
            storms: { name: 'Severe storms', one: 'severe storm', color: '#9085e9', desc: 'Wind and rain',
                tips: 'Shelter in an interior room away from windows, and stay off flooded roads.' },
            ice: { name: 'Sea and lake ice', one: 'ice', color: '#a5e3f5', desc: 'Ice changes',
                tips: 'Keep off thin or breaking ice and follow local maritime warnings.' },
            other: { name: 'Other', one: 'event', color: '#9aa3ad', desc: '',
                tips: 'Follow the guidance of your local civil defense authority.' }
        };
        const DOCK = ['wildfires', 'floods', 'earthquakes', 'volcanoes', 'storms', 'ice'];

        function catSlug(title) {
            const c = String(title || '').toLowerCase();
            if (c.includes('fire')) return 'wildfires';
            if (c.includes('flood')) return 'floods';
            if (c.includes('earthquake') || c.includes('terremoto') || c.includes('sismo')) return 'earthquakes';
            if (c.includes('volcan') || c.includes('vulc')) return 'volcanoes';
            if (c.includes('storm') || c.includes('tempest')) return 'storms';
            if (c.includes('ice')) return 'ice';
            return 'other';
        }

        const PERIODS = { '30d': 30, '90d': 90, '6m': 182, '12m': 365, 'all': null };
        const PERIOD_TEXT = { '30d': 'in the last 30 days', '90d': 'in the last 90 days', '6m': 'in the last 6 months', '12m': 'in the last year', 'all': 'in the whole period' };

        // ========================================================
        // 3. SMALL HELPERS
        // ========================================================
        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        // Simple line icons (no emoji)
        const ICON_PATHS = {
            calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
            pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
            globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
            ruler: '<path d="M3 17 17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>',
            check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
            alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>',
            info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/>',
            cross: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
            close: '<path d="M6 6l12 12M18 6 6 18"/>',
            external: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
            radar: '<path d="M4 20 20 4"/><path d="M8.5 8.5a5 5 0 0 0 7 7"/><path d="M5 5a10 10 0 0 0 14 14"/><circle cx="17" cy="7" r="2"/>',
            back: '<path d="M15 6l-6 6 6 6"/>',
            download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
            layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
            clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
            shield: '<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
            eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
            help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.01"/>',
            play: '<path d="M7 4v16l13-8z"/>',
            search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'
        };
        function icon(name) {
            return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[name] || ''}</svg>`;
        }

        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const p2 = n => String(n).padStart(2, '0');

        // "12 Oct 2026, 20:00 UTC" (always UTC: every source works in UTC)
        function fmtDate(iso, withTime = true) {
            const d = new Date(iso);
            if (!iso || isNaN(d)) return '-';
            const day = `${p2(d.getUTCDate())} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
            return withTime ? `${day}, ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())} UTC` : day;
        }
        // "2026-10-04" -> "04 Oct 2026" / short "04 Oct"
        function fmtDay(ymd, short = false) {
            if (!ymd) return '-';
            const [y, m, d] = String(ymd).slice(0, 10).split('-').map(Number);
            return short ? `${p2(d)} ${MONTHS[m - 1]}` : `${p2(d)} ${MONTHS[m - 1]} ${y}`;
        }
        const isoSec = d => new Date(d).toISOString().replace(/\.\d{3}Z$/, 'Z');
        const ymd = d => new Date(d).toISOString().slice(0, 10);

        function fmtLat(lat) { return `${Math.abs(lat).toFixed(3)}° ${lat >= 0 ? 'N' : 'S'}`; }
        function fmtLon(lon) { return `${Math.abs(lon).toFixed(3)}° ${lon >= 0 ? 'E' : 'W'}`; }
        function fmtKm(km) {
            if (km < 0.05) return 'same position';
            if (km < 1) return `${Math.round(km * 1000)} m`;
            return `${km < 10 ? km.toFixed(1) : Math.round(km)} km`;
        }
        function fmtNum(n, digits = 1) {
            if (n === null || n === undefined || !Number.isFinite(Number(n))) return '-';
            return Number(n).toLocaleString('en-US', { maximumFractionDigits: digits, minimumFractionDigits: 0 });
        }
        function plural(n, one, many) { return `${fmtNum(n, 0)} ${n === 1 ? one : (many || one + 's')}`; }

        function fmtSize(ev) {
            if (ev.mag === null || ev.mag === undefined) return null;
            const unit = String(ev.magUnit || '').toLowerCase();
            if (unit.startsWith('hectare')) return { label: 'Burned area', value: `${fmtNum(Math.round(ev.mag), 0)} ha` };
            if (unit.startsWith('kts')) return { label: 'Wind speed', value: `${fmtNum(ev.mag, 0)} knots` };
            if (ev.cat === 'earthquakes') return { label: 'Magnitude', value: `${fmtNum(ev.mag, 1)} ${ev.magUnit || ''}`.trim() };
            return { label: 'Size', value: `${fmtNum(ev.mag)} ${ev.magUnit || ''}`.trim() };
        }

        function haversineKm(lat1, lon1, lat2, lon2) {
            const R = 6371, toR = Math.PI / 180;
            const dLat = (lat2 - lat1) * toR, dLon = (lon2 - lon1) * toR;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * toR) * Math.cos(lat2 * toR) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }
        const lon180 = lon => ((lon + 180) % 360 + 360) % 360 - 180;

        async function fetchJson(url, { timeout = 20000, ...opts } = {}) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeout);
            try {
                const res = await fetch(url, { ...opts, signal: ctrl.signal });
                if (!res.ok) {
                    let detail = '';
                    try {
                        const j = await res.json();
                        detail = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail ?? j);
                    } catch (e) { /* not JSON */ }
                    const err = new Error(`HTTP ${res.status}${detail ? ': ' + detail : ''}`);
                    err.status = res.status;
                    err.detail = detail;
                    throw err;
                }
                if (res.status === 204) return null;
                return await res.json();
            } catch (e) {
                if (e.name === 'AbortError') throw new Error('the service took too long to answer');
                throw e;
            } finally {
                clearTimeout(timer);
            }
        }

        function apiFetch(path, { method = 'GET', body, timeout = 30000 } = {}) {
            const headers = { 'chave': API_KEY };
            if (body !== undefined) headers['content-type'] = 'application/json';
            return fetchJson(API_BASE + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, timeout });
        }
        const apiFileUrl = (recordId, name) =>
            `${API_BASE}/api/eventos/${encodeURIComponent(recordId)}/analise/arquivos/${encodeURIComponent(name)}?chave=${encodeURIComponent(API_KEY)}`;

        // ========================================================
        // 4. GEOMETRY (country polygons, no extra library)
        // ========================================================
        let countriesData = null;
        let countryBoxes = [];

        function countryName(f) {
            const p = (f && f.properties) || {};
            return p.ADMIN || p.name || p.NAME || p.NAME_EN || 'Unknown';
        }
        function polysOf(geom) {
            if (!geom) return [];
            return geom.type === 'Polygon' ? [geom.coordinates] : geom.type === 'MultiPolygon' ? geom.coordinates : [];
        }
        function boxOfRing(ring) {
            let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
            ring.forEach(([x, y]) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; });
            return [x0, y0, x1, y1];
        }
        function boxOfGeom(geom) {
            let b = [180, 90, -180, -90];
            polysOf(geom).forEach(poly => {
                const r = boxOfRing(poly[0] || []);
                b = [Math.min(b[0], r[0]), Math.min(b[1], r[1]), Math.max(b[2], r[2]), Math.max(b[3], r[3])];
            });
            return b;
        }
        // Countries that cross the 180° line (USA, Russia, Fiji) are split in a west and an east box
        function boxGroups(geom) {
            const west = [], east = [];
            polysOf(geom).forEach(poly => {
                const b = boxOfRing(poly[0] || []);
                ((b[0] + b[2]) / 2 < 0 ? west : east).push(b);
            });
            const merge = list => list.reduce((a, b) => [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])]);
            const groups = [west, east].filter(l => l.length).map(merge);
            if (groups.length === 2) {
                const all = merge(groups);
                if (all[2] - all[0] <= 180) return [all];
            }
            return groups;
        }
        function inRing(lon, lat, ring) {
            let inside = false;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                const [xi, yi] = ring[i], [xj, yj] = ring[j];
                if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
            }
            return inside;
        }
        function inGeom(lon, lat, geom) {
            return polysOf(geom).some(poly => poly.length && inRing(lon, lat, poly[0]) && !poly.slice(1).some(h => inRing(lon, lat, h)));
        }
        function countryAt(lon, lat) {
            if (!countriesData) return null;
            for (let i = 0; i < countriesData.features.length; i++) {
                const b = countryBoxes[i];
                if (!b || lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) continue;
                if (inGeom(lon, lat, countriesData.features[i].geometry)) return countriesData.features[i];
            }
            return null;
        }
        // Coastal points can fall just offshore of the simplified border: take the nearest country within ~50 km
        function nearestCountry(lon, lat, maxDeg = 0.5) {
            if (!countriesData) return null;
            let best = null, bestD = maxDeg * maxDeg;
            countriesData.features.forEach((f, i) => {
                const b = countryBoxes[i];
                if (!b || lon < b[0] - maxDeg || lon > b[2] + maxDeg || lat < b[1] - maxDeg || lat > b[3] + maxDeg) return;
                polysOf(f.geometry).forEach(poly => (poly[0] || []).forEach(([x, y]) => {
                    const d = (x - lon) ** 2 + (y - lat) ** 2;
                    if (d < bestD) { bestD = d; best = f; }
                }));
            });
            return best;
        }
        const countryOf = (lon, lat) => countryAt(lon, lat) || nearestCountry(lon, lat);

        // Area centroid of a polygon's outer ring (flood areas in EONET are polygons)
        function ringCentroid(ring) {
            let a = 0, cx = 0, cy = 0;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                const [x0, y0] = ring[j], [x1, y1] = ring[i];
                const f = x0 * y1 - x1 * y0;
                a += f; cx += (x0 + x1) * f; cy += (y0 + y1) * f;
            }
            if (Math.abs(a) < 1e-12) {
                return [ring.reduce((s, p) => s + p[0], 0) / ring.length, ring.reduce((s, p) => s + p[1], 0) / ring.length];
            }
            return [cx / (3 * a), cy / (3 * a)];
        }

        // ========================================================
        // 5. EVENT MODEL: the three sources in one shape
        //    key = "<source>:<id>" so the same event from two sources merges
        // ========================================================
        let apiEvents = [];                 // Disaster API (reference database)
        const apiByKey = new Map();
        const eventsByKey = new Map();      // everything shown so far (API + live)
        let apiStart = '2025-01-01';

        function fromApi(r) {
            const lat = parseFloat(r.lat ?? r.Latitude);
            const lon = parseFloat(r.lon ?? r.Longitude);
            if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90) return null;
            const source = String(r.source || (String(r.event_id || '').startsWith('EONET') ? 'eonet' : 'usgs')).toLowerCase();
            const eventId = String(r.event_id || r.ID_Desastre);
            const time = r.event_time_utc || r.Data_Desastre;
            const categoryTitle = r.category || r.Categoria || 'Unknown';
            return {
                key: `${source}:${eventId}`,
                source, eventId,
                recordId: r.record_id || `${eventId}@${time}`,
                title: r.title || r.Titulo || eventId,
                cat: catSlug(categoryTitle),
                categoryTitle,
                time,
                lat, lon: lon180(lon),
                apiLat: lat, apiLon: lon180(lon),
                mag: (typeof r.magnitude_value === 'number') ? r.magnitude_value : null,
                magUnit: r.magnitude_unit || null,
                inApi: true,
                live: null,          // filled by the live comparison
                footprint: null,     // EONET polygon, when there is one
                links: [],
                closed: undefined,
                country: null,
                check: null
            };
        }

        // EONET event -> one point: the latest geometry inside the period
        function fromEonet(e, startIso) {
            const geoms = (e.geometry || []).filter(g => g.date && g.coordinates);
            if (!geoms.length) return null;
            const inPeriod = geoms.filter(g => !startIso || g.date >= startIso);
            const g = (inPeriod.length ? inPeriod : geoms).reduce((a, b) => (b.date > a.date ? b : a));
            let lon, lat, footprint = null;
            if (g.type === 'Point') {
                [lon, lat] = g.coordinates;
            } else if (g.type === 'Polygon') {
                [lon, lat] = ringCentroid(g.coordinates[0]);
                footprint = { type: 'Polygon', coordinates: g.coordinates };
            } else return null;
            const categoryTitle = (e.categories && e.categories[0] && e.categories[0].title) || 'Unknown';
            return {
                key: `eonet:${e.id}`,
                source: 'eonet', eventId: e.id, recordId: null,
                title: e.title || e.id,
                cat: catSlug(categoryTitle), categoryTitle,
                time: isoSec(g.date),
                lat, lon: lon180(lon),
                mag: (typeof g.magnitudeValue === 'number') ? g.magnitudeValue : null,
                magUnit: g.magnitudeUnit || null,
                inApi: false, live: e, footprint,
                links: (e.sources || []).map(s => ({ label: `Report (${s.id})`, url: s.url })),
                closed: e.closed || null,
                country: null, check: null
            };
        }

        function fromUsgs(f) {
            const p = f.properties || {}, c = (f.geometry && f.geometry.coordinates) || [];
            if (c.length < 2 || !p.time) return null;
            return {
                key: `usgs:${f.id}`,
                source: 'usgs', eventId: f.id, recordId: null,
                title: p.title || f.id,
                cat: 'earthquakes', categoryTitle: 'Earthquakes',
                time: isoSec(p.time),
                lat: c[1], lon: lon180(c[0]), depthKm: c[2],
                mag: (typeof p.mag === 'number') ? p.mag : null,
                magUnit: p.magType || null,
                inApi: false, live: f, footprint: null,
                links: p.url ? [{ label: 'USGS event page', url: p.url }] : [],
                closed: undefined,
                country: null, check: null
            };
        }

        // ========================================================
        // 6. VERIFICATION: compare the Disaster API record with the official live source
        // ========================================================
        function checkAgainstEonet(api, e) {
            const geoms = (e.geometry || []).filter(g => g.date && g.coordinates);
            const rows = [];
            const g = geoms.find(x => isoSec(x.date) === api.time);
            let status = 'verified', footprint = null, display = null;

            if (g) {
                rows.push({ s: 'ok', t: `Date matches NASA EONET (${fmtDate(api.time)})` });
                if (g.type === 'Point') {
                    const d = haversineKm(api.apiLat, api.apiLon, g.coordinates[1], g.coordinates[0]);
                    if (d <= 1) rows.push({ s: 'ok', t: `Position matches NASA EONET (${fmtKm(d)})` });
                    else { rows.push({ s: 'bad', t: `Position differs from NASA EONET by ${fmtKm(d)}` }); status = 'differs'; }
                } else if (g.type === 'Polygon') {
                    const ring = g.coordinates[0];
                    const [cx, cy] = ringCentroid(ring);
                    const isVertex = ring.some(([x, y]) => Math.abs(x - api.apiLon) < 1e-6 && Math.abs(y - api.apiLat) < 1e-6);
                    const d = haversineKm(api.apiLat, api.apiLon, cy, cx);
                    footprint = { type: 'Polygon', coordinates: g.coordinates };
                    display = [cx, cy];
                    rows.push({
                        s: isVertex || inGeom(api.apiLon, api.apiLat, footprint) ? 'ok' : 'warn',
                        t: isVertex
                            ? `NASA EONET mapped this ${CATS[api.cat].one} as an area. The database point is on its edge, so the map shows the centre of the area (${fmtKm(d)} away) and the outline.`
                            : `NASA EONET mapped this ${CATS[api.cat].one} as an area; the map shows its outline and centre (${fmtKm(d)} from the database point).`
                    });
                    if (!isVertex && !inGeom(api.apiLon, api.apiLat, footprint)) status = 'differs';
                    else status = 'adjusted';
                }
            } else {
                const near = geoms.map(x => Math.abs(new Date(x.date) - new Date(api.time))).sort((a, b) => a - b)[0];
                rows.push({ s: 'bad', t: `NASA EONET has no record on ${fmtDate(api.time)}${near !== undefined ? ` (closest is ${Math.round(near / 3.6e6)} h away)` : ''}` });
                status = 'differs';
            }
            const liveCat = catSlug(e.categories && e.categories[0] && e.categories[0].title);
            rows.push(liveCat === api.cat
                ? { s: 'ok', t: `Type matches (${CATS[api.cat].name})` }
                : { s: 'bad', t: `Type differs: NASA EONET says ${CATS[liveCat].name}` });
            if (liveCat !== api.cat) status = 'differs';
            return { status, rows, footprint, display, closed: e.closed || null, links: (e.sources || []).map(s => ({ label: `Report (${s.id})`, url: s.url })) };
        }

        function checkAgainstUsgs(api, f) {
            const p = f.properties || {}, c = f.geometry.coordinates;
            const rows = [];
            let status = 'verified';
            const dt = Math.abs(new Date(p.time) - new Date(api.time)) / 1000;
            if (dt <= 1) rows.push({ s: 'ok', t: `Time matches USGS (${fmtDate(api.time)})` });
            else { rows.push({ s: 'bad', t: `Time differs from USGS by ${Math.round(dt)} s` }); status = 'differs'; }
            const d = haversineKm(api.apiLat, api.apiLon, c[1], c[0]);
            if (d <= 1) rows.push({ s: 'ok', t: `Epicentre matches USGS (${fmtKm(d)})` });
            else { rows.push({ s: 'warn', t: `Epicentre differs from USGS by ${fmtKm(d)} (USGS may have revised it)` }); status = 'differs'; }
            if (api.mag !== null && typeof p.mag === 'number') {
                if (Math.abs(p.mag - api.mag) < 0.05) rows.push({ s: 'ok', t: `Magnitude matches USGS (${Number(p.mag).toFixed(1)})` });
                else { rows.push({ s: 'warn', t: `Magnitude revised by USGS: ${Number(api.mag).toFixed(1)} in the database, ${Number(p.mag).toFixed(1)} now` }); status = 'differs'; }
            }
            return { status, rows, footprint: null, display: null, links: p.url ? [{ label: 'USGS event page', url: p.url }] : [] };
        }

        // Merge one live event into its API twin, or return the live event as a new one
        function mergeLive(live, raw) {
            const api = apiByKey.get(live.key);
            if (!api) {
                live.check = {
                    status: 'single',
                    rows: [
                        { s: 'ok', t: `Comes straight from the official ${live.source === 'usgs' ? 'USGS' : 'NASA EONET'} feed` },
                        { s: 'info', t: 'Not in the Disaster API database (it covers South America)' }
                    ]
                };
                return live;
            }
            const res = live.source === 'usgs' ? checkAgainstUsgs(api, raw) : checkAgainstEonet(api, raw);
            api.check = { status: res.status, rows: [{ s: 'ok', t: 'Recorded in the Disaster API database' }, ...res.rows] };
            api.live = raw;
            api.links = res.links;
            if (res.closed !== undefined) api.closed = res.closed;
            if (res.footprint) api.footprint = res.footprint;
            if (res.display) { api.lon = res.display[0]; api.lat = res.display[1]; }
            return api;
        }

        // Check one API event by its ID (used when the area query did not return it)
        async function verifyById(ev) {
            if (!ev.inApi || ev.live) return;
            try {
                if (ev.source === 'usgs') {
                    const f = await fetchJson(`${USGS_QUERY}?eventid=${encodeURIComponent(ev.eventId)}&format=geojson`, { timeout: 15000 });
                    if (!f) throw Object.assign(new Error('not found'), { status: 404 });
                    mergeLive(fromUsgs(f), f);
                } else {
                    const e = await fetchJson(`${EONET_BASE}/events/${encodeURIComponent(ev.eventId)}`, { timeout: 15000 });
                    mergeLive(fromEonet(e, null), e);
                }
            } catch (err) {
                ev.check = {
                    status: err.status === 404 ? 'differs' : 'unavailable',
                    rows: [
                        { s: 'ok', t: 'Recorded in the Disaster API database' },
                        err.status === 404
                            ? { s: 'bad', t: `Not found in the official ${ev.source === 'usgs' ? 'USGS' : 'NASA EONET'} feed` }
                            : { s: 'info', t: `Could not reach the official feed to double-check (${err.message})` }
                    ]
                };
            }
        }

        const CHECK_BADGE = {
            verified: ['good', 'Verified by 2 sources'],
            adjusted: ['good', 'Verified, position refined'],
            differs: ['warn', 'Sources disagree'],
            single: ['info', 'Official live source'],
            unavailable: ['info', 'Not double-checked'],
            pending: ['info', 'Checking...']
        };

        // ========================================================
        // 7. GLOBE
        // ========================================================
        const map = new maplibregl.Map({
            container: 'map',
            zoom: 1.9,
            center: [-40.0, 0.0],
            pitch: 0,
            maxPitch: 85,
            attributionControl: false
        });

        map.setStyle('https://tiles.openfreemap.org/styles/bright', {
            transformStyle: (previousStyle, nextStyle) => {
                nextStyle.projection = { type: 'globe' };
                nextStyle.layers.forEach(l => {
                    if (l.type === 'background') l.paint = { 'background-opacity': 0 };
                });
                nextStyle.sources = {
                    ...nextStyle.sources,
                    satelliteSource: {
                        type: 'raster',
                        tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],
                        tileSize: 256
                    },
                    terrainSource: {
                        type: 'raster-dem',
                        url: 'https://tiles.mapterhorn.com/tilejson.json'
                    }
                };
                nextStyle.terrain = { source: 'terrainSource', exaggeration: 1.15 };
                nextStyle.sky = { 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 0.75, 3, 0.15] };
                const firstRoad = nextStyle.layers.find(l => l['source-layer'] === 'transportation');
                const idx = firstRoad ? nextStyle.layers.indexOf(firstRoad) : 0;
                nextStyle.layers.splice(idx, 0, {
                    id: 'satellite', type: 'raster', source: 'satelliteSource',
                    layout: { visibility: 'visible' }, paint: { 'raster-opacity': 1 }
                });
                return nextStyle;
            }
        });

        // State of the explore view
        const state = {
            period: '6m',
            cat: 'all',
            area: null,            // { kind: 'country'|'point', name, feature, lat, lon, events, sources }
            selectedKey: null,
            loadToken: 0
        };

        function periodStart(period = state.period) {
            const days = PERIODS[period];
            if (!days) return apiStart;
            return ymd(Date.now() - days * 864e5);
        }

        // ---------- 7.1 Map layers (WebGL, glued to the globe surface) ----------
        const EMPTY = { type: 'FeatureCollection', features: [] };
        const radius = (k = 1) => ['interpolate', ['linear'], ['zoom'], 1, 3.5 * k, 4, 6 * k, 8, 9 * k, 12, 12 * k];

        function addEventLayers() {
            if (map.getSource('hazards')) return;
            map.addSource('hazards', { type: 'geojson', data: EMPTY });
            map.addSource('footprint', { type: 'geojson', data: EMPTY });
            map.addSource('click-point', { type: 'geojson', data: EMPTY });

            map.addLayer({ id: 'footprint-fill', type: 'fill', source: 'footprint', paint: { 'fill-color': '#3987e5', 'fill-opacity': 0.28 } });
            map.addLayer({ id: 'footprint-line', type: 'line', source: 'footprint', paint: { 'line-color': '#93c5fd', 'line-width': 2 } });
            map.addLayer({
                id: 'hazard-halo', type: 'circle', source: 'hazards',
                paint: { 'circle-radius': radius(1.8), 'circle-color': ['get', 'color'], 'circle-opacity': 0.25, 'circle-blur': 0.6, 'circle-pitch-alignment': 'map' }
            });
            map.addLayer({
                id: 'hazard-points', type: 'circle', source: 'hazards',
                paint: {
                    'circle-radius': radius(1), 'circle-color': ['get', 'color'],
                    'circle-stroke-color': '#ffffff', 'circle-stroke-width': 1.5, 'circle-pitch-alignment': 'map'
                }
            });
            map.addLayer({
                id: 'hazard-selected', type: 'circle', source: 'hazards', filter: ['==', ['get', 'key'], ''],
                paint: {
                    'circle-radius': radius(2.4), 'circle-color': 'rgba(0,0,0,0)',
                    'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2.5, 'circle-pitch-alignment': 'map'
                }
            });
            map.addLayer({
                id: 'click-point-ring', type: 'circle', source: 'click-point',
                paint: { 'circle-radius': radius(2.2), 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-color': '#00e5ff', 'circle-stroke-width': 2, 'circle-pitch-alignment': 'map' }
            });
            applyCategoryFilter();
        }

        function setPoints(events) {
            const src = map.getSource('hazards');
            if (!src) return;
            src.setData({
                type: 'FeatureCollection',
                features: events.map(ev => ({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [ev.lon, ev.lat] },
                    properties: { key: ev.key, cat: ev.cat, color: CATS[ev.cat].color }
                }))
            });
        }

        function applyCategoryFilter() {
            if (!map.getLayer('hazard-points')) return;
            const f = state.cat === 'all' ? null : ['==', ['get', 'cat'], state.cat];
            map.setFilter('hazard-points', f);
            map.setFilter('hazard-halo', f);
            updateCountryTint();
        }

        function markSelected(key) {
            state.selectedKey = key;
            if (map.getLayer('hazard-selected')) map.setFilter('hazard-selected', ['==', ['get', 'key'], key || '']);
            const ev = key && eventsByKey.get(key);
            const src = map.getSource('footprint');
            if (src) src.setData(ev && ev.footprint ? { type: 'Feature', geometry: ev.footprint, properties: {} } : EMPTY);
        }

        function markClick(lng, lat) {
            const src = map.getSource('click-point');
            if (src) src.setData(lng === null ? EMPTY : { type: 'Feature', geometry: { type: 'Point', coordinates: [lng, lat] }, properties: {} });
        }

        // Halo pulse (~30 fps, one paint update for all points)
        let lastPulse = 0;
        function pulse(t) {
            if (t - lastPulse > 33 && map.getLayer('hazard-halo') && !document.getElementById('radar-view').classList.contains('open')) {
                lastPulse = t;
                const p = (t % 2200) / 2200;
                map.setPaintProperty('hazard-halo', 'circle-radius', radius(1.2 + 1.4 * p));
                map.setPaintProperty('hazard-halo', 'circle-opacity', 0.45 * (1 - p));
            }
            requestAnimationFrame(pulse);
        }
        requestAnimationFrame(pulse);

        // ---------- 7.2 Countries ----------
        let hoveredCountryId = null;
        let selectedCountryId = null;

        function updateCountryTint() {
            if (!map.getLayer('paises-fill')) return;
            const prop = state.cat === 'all' ? '_n_all' : `_n_${state.cat}`;
            map.setPaintProperty('paises-fill', 'fill-opacity', [
                'case',
                ['boolean', ['feature-state', 'selected'], false], 0.3,
                ['boolean', ['feature-state', 'hover'], false], 0.22,
                ['>', ['coalesce', ['get', prop], 0], 0], 0.1,
                0
            ]);
        }

        function countCountries() {
            if (!countriesData) return;
            const counts = new Map();
            apiEvents.forEach(ev => {
                if (!ev.countryId) return;
                const c = counts.get(ev.countryId) || {};
                c._n_all = (c._n_all || 0) + 1;
                c[`_n_${ev.cat}`] = (c[`_n_${ev.cat}`] || 0) + 1;
                counts.set(ev.countryId, c);
            });
            countriesData.features.forEach(f => {
                Object.keys(f.properties).filter(k => k.startsWith('_n_')).forEach(k => delete f.properties[k]);
                Object.assign(f.properties, counts.get(f.id) || {});
            });
            const src = map.getSource('paises-source');
            if (src) src.setData(countriesData);
            buildCountryList();
        }

        function assignCountries(list) {
            if (!countriesData) return;
            list.forEach(ev => {
                if (ev.country) return;
                const f = countryOf(ev.apiLon ?? ev.lon, ev.apiLat ?? ev.lat);
                ev.country = f ? countryName(f) : null;
                ev.countryId = f ? f.id : null;
            });
        }

        map.on('load', async () => {
